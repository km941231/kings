<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KINGS - 배팅내역</title>
  <link rel="stylesheet" href="common.css">
  <style>
    .bh-page-wrap { max-width: 720px; margin: 0 auto; padding: 16px 12px; }
    .bh-page-title { font-size: 1rem; font-weight: 900; color: #c8a951; letter-spacing: 2px; margin-bottom: 14px; }
    .bh-empty { text-align: center; color: #555; padding: 40px; font-size: 0.85rem; }
    .bh-loading { text-align: center; color: #666; padding: 30px; font-size: 0.82rem; }
    .bh-card {
      background: #13192e;
      border: 1px solid #2a2a4a;
      border-radius: 7px;
      margin-bottom: 8px;
      overflow: hidden;
    }
    .bh-card-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 9px 14px;
      background: #0d1020;
      border-bottom: 1px solid #1a2030;
    }
    .bh-meta { display: flex; flex-direction: column; gap: 3px; }
    .bh-meta-top { display: flex; align-items: center; gap: 7px; }
    .bh-game-badge {
      font-size: 0.65rem; font-weight: 700; padding: 2px 8px; border-radius: 10px;
      background: rgba(200,169,81,0.15); border: 1px solid rgba(200,169,81,0.3); color: #c8a951;
    }
    .bh-choice { font-size: 0.78rem; font-weight: bold; color: #ccc; }
    .bh-date-str { font-size: 0.68rem; color: #555; }
    .bh-win-badge {
      font-size: 0.7rem; font-weight: 900; padding: 3px 10px; border-radius: 10px; letter-spacing: 0.5px;
    }
    .bh-win-badge.win     { background: rgba(74,222,128,0.14); border: 1px solid rgba(74,222,128,0.45); color: #4ade80; }
    .bh-win-badge.lose    { background: rgba(224,85,85,0.14);  border: 1px solid rgba(224,85,85,0.45);  color: #e05555; }
    .bh-win-badge.push    { background: rgba(200,169,81,0.14); border: 1px solid rgba(200,169,81,0.45); color: #c8a951; }
    .bh-win-badge.pending { background: rgba(100,100,100,0.14); border: 1px solid #333; color: #777; }
    .bh-amounts {
      display: flex; gap: 16px; padding: 8px 14px;
    }
    .bh-amt-item { display: flex; flex-direction: column; gap: 2px; }
    .bh-amt-label { font-size: 0.6rem; color: #555; }
    .bh-amt-val   { font-size: 0.82rem; font-weight: bold; color: #ccc; }
    .bh-amt-val.green { color: #4ade80; }
    .bh-amt-val.red   { color: #e05555; }
    .bh-filter-row {
      display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap;
    }
    .bh-clear-btn {
      margin-left: auto; padding: 5px 14px; border-radius: 12px; font-size: 0.72rem; font-weight: 700;
      background: rgba(224,85,85,0.12); border: 1px solid rgba(224,85,85,0.45); color: #f87171;
      cursor: pointer; font-family: inherit; transition: all .15s;
    }
    .bh-clear-btn:hover { background: rgba(224,85,85,0.25); }
    .bh-clear-btn:disabled { opacity: .4; cursor: not-allowed; }
    .bh-filter-btn {
      padding: 5px 14px; border-radius: 12px; font-size: 0.72rem; font-weight: 700;
      background: #13192e; border: 1px solid #2a2a4a; color: #888;
      cursor: pointer; font-family: inherit; transition: all .15s;
    }
    .bh-filter-btn.active { background: rgba(200,169,81,0.15); border-color: #c8a951; color: #c8a951; }
    /* 선택 항목 색상 보드 */
    .bh-choice-row { padding: 8px 14px 0; display: flex; flex-direction: column; gap: 5px; }
    .bh-board-row  { display: flex; gap: 5px; }
    .bh-opt {
      flex: 1; min-width: 50px; height: 34px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 5px; font-size: 0.78rem; font-weight: bold;
      letter-spacing: 0.3px;
    }
    .bh-opt.empty   { border: 1.5px solid #222236; color: #363650; background: transparent; }
    .bh-opt.f-left  { background: linear-gradient(135deg,#922b21,#c0392b); color:#fff; }
    .bh-opt.f-right { background: linear-gradient(135deg,#154360,#1f618d); color:#fff; }
    .bh-opt.f-three { background: linear-gradient(135deg,#6e4c1e,#c8a951); color:#fff; }
    .bh-opt.f-four  { background: linear-gradient(135deg,#4a235a,#7d3c98); color:#fff; }
    .bh-opt.f-tie   { background: linear-gradient(135deg,#7d6608,#f39c12); color:#fff; }
    /* 삭제 버튼 */
    .bh-del-btn {
      background: transparent; border: 1px solid #3a2030; color: #c05568;
      border-radius: 5px; padding: 3px 8px; font-size: 0.85rem;
      cursor: pointer; font-family: inherit; transition: all .15s;
    }
    .bh-del-btn:hover { background: #3a2030; color: #fff; }
  </style>
</head>
<body>

  <div id="loadingScreen">
    <div class="loading-logo">♠ KINGS</div>
    <div class="loading-spinner"></div>
  </div>

  <div id="loginScreen" style="display:none">
    <div class="login-wrap">
      <div class="login-logo-area"><h1>♠ KINGS</h1><p>로그인하고 시작하세요</p></div>
      <div class="login-card">
        <div class="tab-row">
          <button class="tab-btn active" id="tabLogin" onclick="switchTab('login')">로그인</button>
          <button class="tab-btn" id="tabRegister" onclick="switchTab('register')">회원가입</button>
        </div>
        <div class="field"><label>아이디</label><input type="text" id="usernameInput" placeholder="아이디 입력" maxlength="16" autocomplete="username"></div>
        <div class="field"><label>비밀번호</label><input type="password" id="passwordInput" placeholder="6자 이상" onkeydown="handleEnter(event)" autocomplete="current-password"></div>
        <div id="registerFields" style="display:none">
          <div class="field"><label>비밀번호 확인</label><input type="password" id="passwordConfirmInput" placeholder="비밀번호를 다시 입력"></div>
          <div class="field"><label>닉네임</label><input type="text" id="nicknameInput" placeholder="게임에서 표시될 이름" maxlength="12"></div>
          <div class="field"><label>휴대폰 번호</label><input type="tel" id="phoneInput" placeholder="010-0000-0000" maxlength="13" oninput="formatPhone(this)"></div>
          <div class="field"><label>추천인 코드</label><input type="text" id="referralInput" placeholder="추천인 코드 입력 (필수)" maxlength="16"></div>
        </div>
        <p class="error-msg" id="authError"></p>
        <button class="btn-login-submit" id="submitBtn" onclick="handleSubmit()">로그인</button>
      </div>
    </div>
  </div>

  <div id="gameScreen" style="display:none">
    <header class="header">
      <a class="header-logo" href="index.html" style="text-decoration:none;color:inherit">♠ KINGS</a>
      <div class="header-user">
        <div class="user-point-box" id="headerPoints">0 P</div>
        <div class="myinfo-nickname" id="userNickname">—</div>
        <button class="btn-myinfo" onclick="location.href='myinfo.html'">👤 내정보</button>
        <button class="btn-myinfo" id="btnAdmin" style="display:none;border-color:#e05555;color:#e05555;background:#1a0d0d" onclick="location.href='admin.html'">⚙ 관리자</button>
        <button class="btn-logout-top" onclick="handleLogout()">로그아웃</button>
      </div>
      <button class="btn-hamburger" id="btnHamburger" onclick="toggleMobileMenu()">☰</button>
    </header>

    <div class="mobile-menu-overlay" id="mobileMenuOverlay" onclick="closeMobileMenu()">
      <div class="mobile-menu-drawer" onclick="event.stopPropagation()">
        <div class="mob-user-row">
          <div><div class="mob-user-sub">환영합니다</div><div class="mob-user-name" id="mobNickname">—</div></div>
          <div class="user-point-box" id="mobPoints" style="font-size:0.8rem">0 P</div>
        </div>
        <div class="mob-section-title">GAME</div>
        <a class="mob-item" href="ladder.html">사다리 <span class="sidebar-badge">LIVE</span></a>
        <div class="mob-section-title">CASINO</div>
        <a class="mob-item" href="dragon.html">드래곤타이거 <span class="sidebar-badge">LIVE</span></a>
        <a class="mob-item" href="pdragon.html">파워 드래곤타이거 <span class="sidebar-badge">LIVE</span></a>
        <a class="mob-item" href="baccarat.html">바카라 <span class="sidebar-badge">LIVE</span></a>
        <a class="mob-item" href="blackjack.html">블랙잭 <span class="sidebar-badge">LIVE</span></a>
        <div class="mob-section-title">MENU</div>
        <a class="mob-item active" href="bethistory.html">배팅내역</a>
        <div class="mob-actions">
          <button class="btn-myinfo" id="mobBtnAdmin" style="display:none;border-color:#e05555;color:#e05555;background:#1a0d0d" onclick="location.href='admin.html'">⚙ 관리자</button>
          <button class="btn-myinfo" onclick="location.href='myinfo.html'">👤 내정보</button>
          <button class="btn-logout-top" style="flex:1;text-align:center" onclick="handleLogout()">로그아웃</button>
        </div>
      </div>
    </div>

    <nav class="subnav">
      <div class="subnav-category" id="catGame">
        <button class="subnav-cat-btn" onclick="toggleSubnav('game')">게임 <span class="subnav-arrow">▼</span></button>
        <div class="subnav-dropdown"><a class="subnav-drop-item" href="ladder.html">사다리 <span class="sidebar-badge">LIVE</span></a></div>
      </div>
      <div class="subnav-category" id="catCasino">
        <button class="subnav-cat-btn" onclick="toggleSubnav('casino')">카지노 <span class="subnav-arrow">▼</span></button>
        <div class="subnav-dropdown">
          <a class="subnav-drop-item" href="dragon.html">드래곤타이거 <span class="sidebar-badge">LIVE</span></a>
          <a class="subnav-drop-item" href="pdragon.html">파워 드래곤타이거 <span class="sidebar-badge">LIVE</span></a>
          <a class="subnav-drop-item" href="baccarat.html">바카라 <span class="sidebar-badge">LIVE</span></a>
          <a class="subnav-drop-item" href="blackjack.html">블랙잭 <span class="sidebar-badge">LIVE</span></a>
        </div>
      </div>
      <div class="subnav-category" id="catMenu">
        <button class="subnav-cat-btn active" onclick="toggleSubnav('menu')">메뉴 <span class="subnav-arrow">▼</span></button>
        <div class="subnav-dropdown"><a class="subnav-drop-item active" href="bethistory.html">배팅내역</a></div>
      </div>
    </nav>

    <div class="main-layout">
      <aside class="sidebar-left">
        <div class="sidebar-section-title">GAME</div>
        <a class="sidebar-menu-item" href="ladder.html">사다리 <span class="sidebar-badge">LIVE</span></a>
        <div class="sidebar-section-title" style="margin-top:10px">CASINO</div>
        <a class="sidebar-menu-item" href="dragon.html">드래곤타이거 <span class="sidebar-badge">LIVE</span></a>
        <a class="sidebar-menu-item" href="pdragon.html">파워 드래곤타이거 <span class="sidebar-badge">LIVE</span></a>
        <a class="sidebar-menu-item" href="baccarat.html">바카라 <span class="sidebar-badge">LIVE</span></a>
        <a class="sidebar-menu-item" href="blackjack.html">블랙잭 <span class="sidebar-badge">LIVE</span></a>
        <div class="sidebar-section-title" style="margin-top:10px">MENU</div>
        <a class="sidebar-menu-item active" href="bethistory.html">배팅내역</a>
      </aside>

      <main class="main-content">
        <div class="bh-page-wrap">
          <div class="bh-page-title">📋 배팅 내역</div>

          <div class="bh-filter-row" id="bhFilterRow">
            <button class="bh-filter-btn active" onclick="setFilter('all')" id="bfAll">전체</button>
            <button class="bh-filter-btn" onclick="setFilter('win')" id="bfWin">승리</button>
            <button class="bh-filter-btn" onclick="setFilter('lose')" id="bfLose">패배</button>
            <button class="bh-filter-btn" onclick="setFilter('pending')" id="bfPending">진행중</button>
            <button class="bh-clear-btn" onclick="clearAllBets()" id="bhClearBtn">🗑 전체 삭제</button>
          </div>

          <div id="bhList"><div class="bh-loading">내역 로딩 중...</div></div>
        </div>
      </main>

      <aside class="sidebar-right" style="display:none"></aside>
    </div>
  </div>

  <script type="module">
    import { auth, db, onAuthStateChanged, doc, getDoc, setDoc, updateDoc,
             collection, getDocs, addDoc, query, orderBy, serverTimestamp, signOut,
             createUserWithEmailAndPassword, signInWithEmailAndPassword }
      from './common.js';
    import { limit, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    let points = 0;
    let currentUid = null;
    let allHistory = [];
    let currentFilter = 'all';

    onAuthStateChanged(auth, async (user) => {
      document.getElementById('loadingScreen').style.display = 'none';
      if (user) {
        currentUid = user.uid;
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('gameScreen').style.display  = 'flex';
        document.getElementById('gameScreen').style.flexDirection = 'column';
        await loadUserData(user.uid);
        await loadHistory();
      } else {
        currentUid = null;
        document.getElementById('loginScreen').style.display = 'flex';
        document.getElementById('gameScreen').style.display  = 'none';
      }
    });

    async function loadUserData(uid) {
      try {
        const snap = await getDoc(doc(db, 'users', uid));
        if (snap.exists()) {
          const data = snap.data();
          points = data.points ?? 0;
          const nick = data.nickname || data.username || '유저';
          document.getElementById('userNickname').textContent = nick;
          document.getElementById('mobNickname').textContent  = nick;
          document.getElementById('headerPoints').textContent = points.toLocaleString() + ' P';
          const mob = document.getElementById('mobPoints'); if (mob) mob.textContent = points.toLocaleString() + ' P';
          if (data.isAdmin) document.getElementById('btnAdmin').style.display = 'flex'; { const m=document.getElementById('mobBtnAdmin'); if(m) m.style.display='flex'; }
        }
      } catch(e) {}
    }

    async function loadHistory() {
      const el = document.getElementById('bhList');
      el.innerHTML = '<div class="bh-loading">내역 로딩 중...</div>';
      try {
        const q = query(collection(db, 'users', currentUid, 'bets'), orderBy('timestamp', 'desc'), limit(200));
        const snap = await getDocs(q);
        allHistory = snap.docs.map(d => ({ _id: d.id, ...d.data() }));
        renderHistory();
      } catch(e) {
        el.innerHTML = '<div class="bh-empty">내역을 불러오지 못했습니다.</div>';
      }
    }

    function renderHistory() {
      const el = document.getElementById('bhList');
      let list = allHistory;
      if (currentFilter === 'win')     list = allHistory.filter(h => h.isWin || h.status === 'win');
      if (currentFilter === 'lose')    list = allHistory.filter(h => !h.isWin && h.status === 'settled' && !h.payout);
      if (currentFilter === 'pending') list = allHistory.filter(h => h.status === 'pending');

      if (list.length === 0) {
        el.innerHTML = '<div class="bh-empty">해당하는 배팅 내역이 없습니다.</div>';
        return;
      }

      const gameNames = {
        dragon: '드래곤타이거', pdragon: '파워 드래곤타이거', baccarat: '바카라',
        blackjack: '블랙잭', blackjack_table: '블랙잭', ladder: '사다리', sports: '스포츠'
      };

      el.innerHTML = list.map(h => {
        const gameName = h.gameName || gameNames[h.gameType] || h.gameType || '게임';
        const isWin    = h.isWin || h.result === 'win' || h.result === 'bj';
        const isPush   = h.result === 'push' || h.netChange === 0;
        const isPending = h.status === 'pending';
        const badgeCls = isPending ? 'pending' : isPush ? 'push' : isWin ? 'win' : 'lose';
        const badgeTxt = isPending ? '진행중' : isPush ? '무승부' : isWin ? '승리' : '패배';
        const net      = h.netChange ?? (h.payout ? h.payout - h.bet : -h.bet);
        const netCls   = net > 0 ? 'green' : net < 0 ? 'red' : '';
        const netStr   = net > 0 ? '+' + net.toLocaleString() + ' P' : net.toLocaleString() + ' P';

        let dateStr = '';
        if (h.timestamp?.toDate) {
          const d = h.timestamp.toDate();
          dateStr = d.toLocaleDateString('ko-KR') + ' ' + d.toLocaleTimeString('ko-KR', {hour:'2-digit', minute:'2-digit'});
        } else if (h.createdAt) {
          const d = new Date(h.createdAt);
          dateStr = d.toLocaleDateString('ko-KR') + ' ' + d.toLocaleTimeString('ko-KR', {hour:'2-digit', minute:'2-digit'});
        }

        const choiceCells = bhBoard(h.gameType, h.choice || h.number || '-');

        return `<div class="bh-card">
          <div class="bh-card-head">
            <div class="bh-meta">
              <div class="bh-meta-top">
                <span class="bh-game-badge">${gameName}</span>
              </div>
              <span class="bh-date-str">${dateStr}</span>
            </div>
            <div style="display:flex;align-items:center;gap:8px">
              <span class="bh-win-badge ${badgeCls}">${badgeTxt}</span>
              <button class="bh-del-btn" onclick="deleteBet('${h._id}')" title="삭제">🗑</button>
            </div>
          </div>
          <div class="bh-choice-row">${choiceCells}</div>
          <div class="bh-amounts">
            <div class="bh-amt-item">
              <span class="bh-amt-label">배팅</span>
              <span class="bh-amt-val">${(h.bet||0).toLocaleString()} P</span>
            </div>
            <div class="bh-amt-item">
              <span class="bh-amt-label">당첨</span>
              <span class="bh-amt-val">${(h.payout||0).toLocaleString()} P</span>
            </div>
            <div class="bh-amt-item">
              <span class="bh-amt-label">손익</span>
              <span class="bh-amt-val ${netCls}">${netStr}</span>
            </div>
          </div>
        </div>`;
      }).join('');
    }

    // 게임별 전체 옵션 보드 — 선택 항목만 색 채움
    function bhBoard(gameType, choice) {
      const c = String(choice || '').trim();
      const cell = (label, sel, cls) => `<span class="bh-opt ${sel ? cls : 'empty'}">${label}</span>`;

      if (gameType === 'dragon' || gameType === 'pdragon') {
        let html = `<div class="bh-board-row">
          ${cell('드래곤', c==='드래곤', 'f-left')}
          ${cell('타이', c==='타이', 'f-tie')}
          ${cell('타이거', c==='타이거', 'f-right')}
        </div>`;
        if (c === '스페셜타이') html += `<div class="bh-board-row">${cell('스페셜타이', true, 'f-four')}</div>`;
        return html;
      }
      if (gameType === 'baccarat') {
        let html = `<div class="bh-board-row">
          ${cell('PLAYER', c==='PLAYER', 'f-left')}
          ${cell('타이', c==='타이', 'f-tie')}
          ${cell('BANKER', c==='BANKER', 'f-right')}
        </div>`;
        if (c==='플레이어 페어' || c==='뱅커 페어') {
          html += `<div class="bh-board-row">
            ${cell('플레이어 페어', c==='플레이어 페어', 'f-left')}
            ${cell('뱅커 페어', c==='뱅커 페어', 'f-right')}
          </div>`;
        }
        return html;
      }
      if (gameType === 'ladder') {
        const toks = c.split(/\s*[×x]\s*/).filter(Boolean);
        const has = v => toks.includes(v);
        let rows = '';
        // 선택한 카테고리의 행만 표시
        if (has('좌') || has('우'))
          rows += `<div class="bh-board-row">${cell('좌', has('좌'), 'f-left')}${cell('우', has('우'), 'f-right')}</div>`;
        if (has('3줄') || has('4줄'))
          rows += `<div class="bh-board-row">${cell('3줄', has('3줄'), 'f-three')}${cell('4줄', has('4줄'), 'f-four')}</div>`;
        if (has('홀') || has('짝'))
          rows += `<div class="bh-board-row">${cell('홀', has('홀'), 'f-left')}${cell('짝', has('짝'), 'f-right')}</div>`;
        return rows || `<div class="bh-board-row">${cell(c || '-', false, 'f-three')}</div>`;
      }
      // 블랙잭 등: 단일 칸
      return `<div class="bh-board-row">${cell(c || '-', !!c && c !== '-', 'f-three')}</div>`;
    }

    window.deleteBet = async function(docId) {
      if (!docId || !currentUid) return;
      if (!confirm('이 배팅 내역을 삭제할까요?')) return;
      try {
        await deleteDoc(doc(db, 'users', currentUid, 'bets', docId));
        allHistory = allHistory.filter(h => h._id !== docId);
        renderHistory();
      } catch(e) { alert('삭제에 실패했습니다.'); }
    };

    window.clearAllBets = async function() {
      if (!currentUid || !allHistory.length) return;
      if (!confirm(`배팅 내역 ${allHistory.length}건을 모두 삭제할까요?\n(되돌릴 수 없습니다)`)) return;
      const btn = document.getElementById('bhClearBtn');
      if (btn) { btn.disabled = true; btn.textContent = '삭제 중...'; }
      try {
        // 순차 삭제 (대량이면 청크로 처리)
        const ids = allHistory.map(h => h._id).filter(Boolean);
        for (const id of ids) {
          await deleteDoc(doc(db, 'users', currentUid, 'bets', id));
        }
        allHistory = [];
        renderHistory();
      } catch(e) { alert('전체 삭제 중 오류가 발생했습니다.'); }
      finally { if (btn) { btn.disabled = false; btn.textContent = '🗑 전체 삭제'; } }
    };

    window.setFilter = function(f) {
      currentFilter = f;
      ['all','win','lose','pending'].forEach(id => {
        const btn = document.getElementById('bf' + id.charAt(0).toUpperCase() + id.slice(1));
        if (btn) btn.classList.toggle('active', id === f);
      });
      renderHistory();
    };

    // bethistory 전용: handleSubmit (휴대폰 검증 없음, 회원가입 후 자동 로그인)
    function toEmail(u) { return u.toLowerCase() + '@kings.com'; }
    window.handleSubmit = async function() {
      const isReg = document.getElementById('tabRegister').classList.contains('active');
      const username = document.getElementById('usernameInput').value.trim();
      const password = document.getElementById('passwordInput').value;
      const btn = document.getElementById('submitBtn');
      const errEl = document.getElementById('authError'); errEl.textContent = '';
      if (!username || !password) { errEl.textContent = '아이디와 비밀번호를 입력해주세요.'; return; }
      btn.disabled = true; btn.textContent = '처리 중...';
      try {
        if (isReg) {
          const confirm = document.getElementById('passwordConfirmInput').value;
          const nickname = document.getElementById('nicknameInput').value.trim();
          const phone = document.getElementById('phoneInput').value.trim();
          const referral = document.getElementById('referralInput').value.trim();
          if (password !== confirm) { errEl.textContent = '비밀번호가 일치하지 않습니다.'; return; }
          if (!nickname) { errEl.textContent = '닉네임을 입력해주세요.'; return; }
          if (!referral) { errEl.textContent = '추천인 코드를 입력해주세요.'; return; }
          const codeSnap = await getDoc(doc(db, 'referralCodes', referral.toUpperCase()));
          if (!codeSnap.exists()) { errEl.textContent = '유효하지 않은 추천인 코드입니다.'; return; }
          const cred = await createUserWithEmailAndPassword(auth, toEmail(username), password);
          await setDoc(doc(db, 'users', cred.user.uid), { username, nickname, phone, referral, points: 10000, createdAt: new Date() });
        } else {
          await signInWithEmailAndPassword(auth, toEmail(username), password);
        }
      } catch(e) {
        const msgs = { 'auth/user-not-found':'존재하지 않는 아이디입니다.', 'auth/wrong-password':'비밀번호가 틀렸습니다.', 'auth/email-already-in-use':'이미 사용 중인 아이디입니다.', 'auth/weak-password':'비밀번호는 6자 이상이어야 합니다.' };
        errEl.textContent = msgs[e.code] || '오류가 발생했습니다: ' + e.message;
        btn.disabled = false; btn.textContent = isReg ? '회원가입' : '로그인';
      }
    };
    // bethistory 전용: 로그아웃 후 index.html 이동
    window.handleLogout = async function() {
      await signOut(auth);
      location.href = 'index.html';
    };
  </script>
</body>
</html>
