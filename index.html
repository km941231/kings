<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KINGS</title>
  <link rel="stylesheet" href="common.css">
  <style>
    .lobby-wrap {
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: linear-gradient(135deg, #0d0d1a, #1a1a2e);
      padding: 20px; gap: 20px;
    }
    .lobby-logo {
      font-size: 2.5rem; font-weight: 900; color: #c8a951;
      letter-spacing: 8px; text-shadow: 0 0 20px rgba(200,169,81,0.5);
    }
    .lobby-subtitle { color: #666; font-size: 0.9rem; letter-spacing: 2px; }
    .lobby-user-row {
      display: flex; align-items: center; gap: 12px;
      font-size: 0.85rem; color: #aaa;
    }
    .lobby-user-row .user-point-box { font-size: 0.82rem; }
    .lobby-grid {
      display: grid; grid-template-columns: repeat(2, 1fr);
      gap: 14px; width: 100%; max-width: 460px;
    }
    .lobby-card {
      display: flex; flex-direction: column; align-items: center;
      gap: 8px; padding: 22px 16px;
      background: #13192e; border: 1px solid #2a2a4a; border-radius: 8px;
      text-decoration: none; color: #ccc; transition: all 0.18s; cursor: pointer;
    }
    .lobby-card:hover {
      background: #1a2240; border-color: #c8a951;
      transform: translateY(-2px); box-shadow: 0 6px 20px rgba(200,169,81,0.2);
    }
    .lobby-card-icon { font-size: 2rem; }
    .lobby-card-name { font-size: 0.88rem; font-weight: bold; color: #e0c87a; }
    .lobby-card-menu .lobby-card-name { color: #9ab; }
    .lobby-card-menu:hover { border-color: #4a9eff; box-shadow: 0 6px 20px rgba(74,158,255,0.18); }
    .lobby-card-badge {
      background: #c8a951; color: #000; font-size: 0.6rem; font-weight: bold;
      padding: 1px 7px; border-radius: 10px; letter-spacing: 1px;
    }
    .lobby-logout {
      background: transparent; border: 1px solid #3a2020; color: #c05555;
      padding: 5px 16px; border-radius: 4px; font-size: 0.75rem;
      cursor: pointer; font-family: inherit;
    }
    .lobby-logout:hover { background: #3a2020; color: #fff; }
    .lobby-admin {
      background: #1a0d0d; border: 1px solid #e05555; color: #e05555;
      padding: 5px 16px; border-radius: 4px; font-size: 0.75rem;
      cursor: pointer; font-family: inherit;
    }
    .lobby-admin:hover { background: #e05555; color: #fff; }
  </style>
</head>
<body>

  <!-- 로딩 -->
  <div id="loadingScreen">
    <div class="loading-logo">♠ KINGS</div>
    <div class="loading-spinner"></div>
  </div>

  <!-- 로그인 화면 -->
  <div id="loginScreen" style="display:none">
    <div class="login-wrap">
      <div class="login-logo-area"><h1>♠ KINGS</h1><p>로그인하고 시작하세요</p></div>
      <div class="login-card">
        <div class="tab-row">
          <button class="tab-btn active" id="tabLogin" onclick="switchTab('login')">로그인</button>
          <button class="tab-btn" id="tabRegister" onclick="switchTab('register')">회원가입</button>
        </div>
        <div class="field"><label>아이디</label><input type="text" id="usernameInput" placeholder="아이디 입력" maxlength="16" autocomplete="username"></div>
        <div class="field"><label>비밀번호</label><input type="password" id="passwordInput" placeholder="6자 이상" onkeydown="handleEnter(event)" autocomplete="current-password"></div>
        <div id="registerFields" style="display:none">
          <div class="field"><label>비밀번호 확인</label><input type="password" id="passwordConfirmInput" placeholder="비밀번호를 다시 입력"></div>
          <div class="field"><label>닉네임</label><input type="text" id="nicknameInput" placeholder="게임에서 표시될 이름" maxlength="12"></div>
          <div class="field"><label>휴대폰 번호</label><input type="tel" id="phoneInput" placeholder="010-0000-0000" maxlength="13" oninput="formatPhone(this)"></div>
          <div class="field"><label>추천인 코드</label><input type="text" id="referralInput" placeholder="추천인 코드 입력 (필수)" maxlength="16"></div>
        </div>
        <p class="error-msg" id="authError"></p>
        <button class="btn-login-submit" id="submitBtn" onclick="handleSubmit()">로그인</button>
      </div>
    </div>
  </div>

  <!-- 게임 선택 화면 -->
  <div id="lobbyScreen" style="display:none">
    <div class="lobby-wrap">
      <div class="lobby-logo">♠ KINGS</div>
      <div class="lobby-user-row">
        <span id="lobbyNickname" style="color:#c8a951;font-weight:bold"></span>
        <span class="user-point-box" id="lobbyPoints">0 P</span>
        <button class="lobby-admin" id="lobbyAdminBtn" style="display:none" onclick="location.href='admin.html'">⚙ 관리자</button>
        <button class="lobby-logout" onclick="handleLogout()">로그아웃</button>
      </div>
      <div class="lobby-grid">
        <a class="lobby-card" href="ladder.html">
          <div class="lobby-card-icon">🪜</div>
          <div class="lobby-card-name">사다리</div>
          <div class="lobby-card-badge">LIVE</div>
        </a>
        <a class="lobby-card" href="sports.html">
          <div class="lobby-card-icon">🏆</div>
          <div class="lobby-card-name">스포츠</div>
          <div class="lobby-card-badge">LIVE</div>
        </a>
        <a class="lobby-card" href="dragon.html">
          <div class="lobby-card-icon">🐉</div>
          <div class="lobby-card-name">드래곤타이거</div>
          <div class="lobby-card-badge">LIVE</div>
        </a>
        <a class="lobby-card" href="pdragon.html">
          <div class="lobby-card-icon">⚡</div>
          <div class="lobby-card-name">파워 드래곤타이거</div>
          <div class="lobby-card-badge">LIVE</div>
        </a>
        <a class="lobby-card" href="baccarat.html">
          <div class="lobby-card-icon">🃏</div>
          <div class="lobby-card-name">바카라</div>
          <div class="lobby-card-badge">LIVE</div>
        </a>
        <a class="lobby-card" href="blackjack.html">
          <div class="lobby-card-icon">♠</div>
          <div class="lobby-card-name">블랙잭</div>
          <div class="lobby-card-badge">LIVE</div>
        </a>
        <a class="lobby-card lobby-card-menu" href="bethistory.html">
          <div class="lobby-card-icon">📋</div>
          <div class="lobby-card-name">배팅내역</div>
        </a>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDJv5VYIt2xFrQmignCwSzuThAkULz1NW8",
      authDomain: "kings-44a9b.firebaseapp.com",
      projectId: "kings-44a9b",
      storageBucket: "kings-44a9b.firebasestorage.app",
      messagingSenderId: "715133382138",
      appId: "1:715133382138:web:62cf478cc321fa418c0843"
    };

    const app  = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db   = getFirestore(app);

    onAuthStateChanged(auth, async (user) => {
      document.getElementById('loadingScreen').style.display = 'none';
      if (user) {
        document.getElementById('loginScreen').style.display  = 'none';
        document.getElementById('lobbyScreen').style.display  = 'block';
        try {
          const snap = await getDoc(doc(db, 'users', user.uid));
          if (snap.exists()) {
            const d = snap.data();
            document.getElementById('lobbyNickname').textContent = d.nickname || d.username || '유저';
            document.getElementById('lobbyPoints').textContent   = (d.points ?? 0).toLocaleString() + ' P';
            if (d.isAdmin) document.getElementById('lobbyAdminBtn').style.display = '';
          }
        } catch(e) {}
      } else {
        document.getElementById('loginScreen').style.display  = 'flex';
        document.getElementById('lobbyScreen').style.display  = 'none';
      }
    });

    function toEmail(u) { return u.toLowerCase() + '@kings.com'; }

    window.formatPhone = function(el) {
      let v = el.value.replace(/\D/g,'');
      if (v.length <= 3) el.value = v;
      else if (v.length <= 7) el.value = v.slice(0,3)+'-'+v.slice(3);
      else el.value = v.slice(0,3)+'-'+v.slice(3,7)+'-'+v.slice(7,11);
    };
    window.switchTab = function(tab) {
      const isReg = tab === 'register';
      document.getElementById('tabLogin').classList.toggle('active', !isReg);
      document.getElementById('tabRegister').classList.toggle('active', isReg);
      document.getElementById('registerFields').style.display = isReg ? 'block' : 'none';
      document.getElementById('submitBtn').textContent = isReg ? '회원가입' : '로그인';
      document.getElementById('authError').textContent = '';
    };
    window.handleEnter = function(e) { if (e.key === 'Enter') handleSubmit(); };
    window.handleSubmit = async function() {
      const isReg = document.getElementById('tabRegister').classList.contains('active');
      const username = document.getElementById('usernameInput').value.trim();
      const password = document.getElementById('passwordInput').value;
      const btn = document.getElementById('submitBtn');
      const errEl = document.getElementById('authError'); errEl.textContent = '';
      if (!username || !password) { errEl.textContent = '아이디와 비밀번호를 입력해주세요.'; return; }
      btn.disabled = true; btn.textContent = '처리 중...';
      try {
        if (isReg) {
          const confirm  = document.getElementById('passwordConfirmInput').value;
          const nickname = document.getElementById('nicknameInput').value.trim();
          const phone    = document.getElementById('phoneInput').value.trim();
          const referral = document.getElementById('referralInput').value.trim();
          if (password !== confirm) { errEl.textContent = '비밀번호가 일치하지 않습니다.'; return; }
          if (!nickname) { errEl.textContent = '닉네임을 입력해주세요.'; return; }
          if (!referral) { errEl.textContent = '추천인 코드를 입력해주세요.'; return; }
          const codeSnap = await getDoc(doc(db, 'referralCodes', referral.toUpperCase()));
          if (!codeSnap.exists()) { errEl.textContent = '유효하지 않은 추천인 코드입니다.'; return; }
          const cred = await createUserWithEmailAndPassword(auth, toEmail(username), password);
          await setDoc(doc(db, 'users', cred.user.uid), { username, nickname, phone, referral, points: 10000, createdAt: new Date() });
        } else {
          await signInWithEmailAndPassword(auth, toEmail(username), password);
        }
      } catch(e) {
        const msgs = {
          'auth/user-not-found': '존재하지 않는 아이디입니다.',
          'auth/wrong-password': '비밀번호가 틀렸습니다.',
          'auth/email-already-in-use': '이미 사용 중인 아이디입니다.',
          'auth/weak-password': '비밀번호는 6자 이상이어야 합니다.'
        };
        errEl.textContent = msgs[e.code] || '오류가 발생했습니다.';
        btn.disabled = false;
        btn.textContent = isReg ? '회원가입' : '로그인';
      }
    };
    window.handleLogout = async function() {
      await signOut(auth);
    };
  </script>
</body>
</html>
