<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KINGS - 홀짝</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #1a1a2e;
      font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
      color: #ccc;
      min-height: 100vh;
    }

    /* ══════════════════════════════
       로그인 화면
    ══════════════════════════════ */
    #loginScreen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #0d0d1a, #1a1a2e);
      padding: 20px;
    }

    .login-wrap { width: 100%; max-width: 420px; }

    .login-logo-area {
      text-align: center;
      margin-bottom: 30px;
    }

    .login-logo-area h1 {
      font-size: 2.2rem;
      font-weight: 900;
      color: #c8a951;
      letter-spacing: 6px;
      text-shadow: 0 0 20px rgba(200,169,81,0.5);
    }

    .login-logo-area p {
      color: #888;
      font-size: 0.85rem;
      margin-top: 6px;
    }

    .login-card {
      background: #16213e;
      border: 1px solid #2a2a4a;
      border-radius: 8px;
      padding: 28px 24px;
    }

    .tab-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      margin-bottom: 24px;
      border: 1px solid #2a2a4a;
      border-radius: 4px;
      overflow: hidden;
    }

    .tab-btn {
      padding: 10px;
      border: none;
      background: #0d0d1a;
      color: #666;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: #c8a951;
      color: #000;
      font-weight: bold;
    }

    .field { margin-bottom: 12px; }

    .field label {
      display: block;
      font-size: 0.78rem;
      color: #c8a951;
      margin-bottom: 5px;
    }

    .field input {
      width: 100%;
      background: #0d0d1a;
      border: 1px solid #2a2a4a;
      border-radius: 4px;
      padding: 10px 12px;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
    }

    .field input:focus { border-color: #c8a951; }
    .field input::placeholder { color: #444; }

    .error-msg {
      font-size: 0.8rem;
      color: #e05555;
      min-height: 18px;
      margin-bottom: 10px;
      text-align: center;
    }

    .btn-login-submit {
      width: 100%;
      padding: 12px;
      background: linear-gradient(90deg, #b8941f, #c8a951, #b8941f);
      border: none;
      border-radius: 4px;
      color: #000;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      letter-spacing: 2px;
      transition: opacity 0.2s;
    }

    .btn-login-submit:hover { opacity: 0.88; }
    .btn-login-submit:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ══════════════════════════════
       게임 화면 전체 레이아웃
    ══════════════════════════════ */
    #gameScreen { display: none; flex-direction: column; min-height: 100vh; }

    /* ─── 상단 헤더 ─── */
    .header {
      background: linear-gradient(90deg, #0d0d1a, #16213e, #0d0d1a);
      border-bottom: 2px solid #c8a951;
      padding: 0 16px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-logo {
      font-size: 1.6rem;
      font-weight: 900;
      color: #c8a951;
      letter-spacing: 4px;
      text-shadow: 0 0 10px rgba(200,169,81,0.4);
    }

    .header-user {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 0.85rem;
    }

    .user-point-box {
      background: #0d0d1a;
      border: 1px solid #c8a951;
      border-radius: 4px;
      padding: 5px 14px;
      color: #c8a951;
      font-weight: bold;
    }

    .user-name-box {
      color: #ccc;
    }

    .user-name-box span { color: #fff; font-weight: bold; }

    .btn-logout-top {
      background: transparent;
      border: 1px solid #444;
      color: #888;
      padding: 5px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.8rem;
      transition: all 0.2s;
    }

    .btn-logout-top:hover { border-color: #e05555; color: #e05555; }

    .btn-myinfo {
      background: #1a2240;
      border: 1px solid #c8a951;
      color: #c8a951;
      padding: 5px 14px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: bold;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-myinfo:hover { background: rgba(200,169,81,0.15); }

    .myinfo-nickname {
      color: #fff;
      font-weight: bold;
      font-size: 0.88rem;
      background: #0d0d1a;
      border: 1px solid #2a2a4a;
      border-radius: 4px;
      padding: 4px 12px;
    }

    /* 내정보 모달 */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 999;
      align-items: center;
      justify-content: center;
    }

    .modal-overlay.open { display: flex; }

    .modal-box {
      background: #16213e;
      border: 1px solid #c8a951;
      border-radius: 8px;
      width: 100%;
      max-width: 360px;
      overflow: hidden;
    }

    .modal-header {
      background: linear-gradient(90deg, #b8941f, #c8a951);
      padding: 12px 18px;
      font-size: 0.9rem;
      font-weight: bold;
      color: #000;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-close {
      background: none;
      border: none;
      color: #000;
      font-size: 1.1rem;
      cursor: pointer;
      font-weight: bold;
    }

    .modal-body { padding: 20px; }

    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #1e2a3a;
      font-size: 0.85rem;
    }

    .info-row:last-child { border-bottom: none; }
    .info-label { color: #888; }
    .info-value { color: #fff; font-weight: bold; }

    /* ─── 서브 네비 ─── */
    .subnav {
      background: #16213e;
      border-bottom: 1px solid #2a2a4a;
      display: flex;
      align-items: center;
      padding: 0 16px;
      height: 38px;
      gap: 4px;
      overflow-x: auto;
    }

    .subnav::-webkit-scrollbar { height: 3px; }
    .subnav::-webkit-scrollbar-thumb { background: #c8a951; }

    .subnav-btn {
      padding: 6px 16px;
      background: transparent;
      border: 1px solid #2a2a4a;
      border-radius: 3px;
      color: #888;
      font-size: 0.82rem;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
    }

    .subnav-btn:hover { background: #1e2a4a; color: #ccc; }

    .subnav-btn.active {
      background: #c8a951;
      border-color: #c8a951;
      color: #000;
      font-weight: bold;
    }

    /* ─── 3단 레이아웃 ─── */
    .main-layout {
      display: grid;
      grid-template-columns: 180px 1fr 280px;
      flex: 1;
      min-height: 0;
    }

    /* ─── 좌측 사이드바 ─── */
    .sidebar-left {
      background: #13192e;
      border-right: 1px solid #2a2a4a;
      padding: 12px 0;
    }

    .sidebar-section-title {
      font-size: 0.7rem;
      color: #c8a951;
      letter-spacing: 1px;
      padding: 8px 14px 4px;
      border-bottom: 1px solid #1e2440;
    }

    .sidebar-menu-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 14px;
      font-size: 0.83rem;
      color: #888;
      cursor: pointer;
      border-left: 3px solid transparent;
      transition: all 0.15s;
    }

    .sidebar-menu-item:hover { background: #1a2240; color: #ccc; }

    .sidebar-menu-item.active {
      background: #1a2240;
      color: #c8a951;
      border-left-color: #c8a951;
      font-weight: bold;
    }

    .sidebar-badge {
      background: #c8a951;
      color: #000;
      font-size: 0.65rem;
      padding: 1px 6px;
      border-radius: 10px;
      font-weight: bold;
    }

    /* ─── 메인 콘텐츠 ─── */
    .main-content {
      padding: 16px;
      overflow-y: auto;
    }

    .content-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .content-title {
      font-size: 1rem;
      color: #c8a951;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .content-title::before {
      content: '';
      display: inline-block;
      width: 4px;
      height: 16px;
      background: #c8a951;
      border-radius: 2px;
    }

    /* ─── 게임 패널 ─── */
    .game-panel {
      background: #13192e;
      border: 1px solid #2a2a4a;
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .game-panel-header {
      background: linear-gradient(90deg, #1a2240, #16213e);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #2a2a4a;
    }

    .game-panel-title {
      font-size: 0.88rem;
      font-weight: bold;
      color: #e0c87a;
    }

    .game-panel-body { padding: 20px; }

    /* 숫자 결과창 */
    .result-display {
      background: #0d0d1a;
      border: 1px solid #2a2a4a;
      border-radius: 6px;
      padding: 24px;
      text-align: center;
      margin-bottom: 20px;
      min-height: 130px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .result-number {
      font-size: 5rem;
      font-weight: 900;
      line-height: 1;
      margin-bottom: 8px;
    }

    .result-number.odd { color: #e05555; text-shadow: 0 0 20px rgba(224,85,85,0.5); }
    .result-number.even { color: #4a9eff; text-shadow: 0 0 20px rgba(74,158,255,0.5); }
    .result-number.rolling { animation: roll 0.08s infinite alternate; }

    @keyframes roll { from { transform: scale(1); } to { transform: scale(1.08); } }

    .result-tag { font-size: 1.1rem; font-weight: bold; letter-spacing: 2px; }
    .result-tag.odd { color: #e05555; }
    .result-tag.even { color: #4a9eff; }

    .result-outcome {
      font-size: 1.4rem;
      font-weight: bold;
      margin-top: 6px;
    }

    .result-outcome.win { color: #4ade80; animation: pop 0.3s ease-out; }
    .result-outcome.lose { color: #e05555; }

    @keyframes pop { 0% { transform: scale(0.7); } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }

    .result-change { font-size: 0.9rem; color: #888; margin-top: 4px; }
    .idle-text { color: #444; font-size: 0.9rem; }

    /* 홀짝 선택 버튼 */
    .choice-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn-odd, .btn-even {
      padding: 18px;
      border-radius: 5px;
      border: 1px solid;
      cursor: pointer;
      font-size: 1.2rem;
      font-weight: bold;
      letter-spacing: 2px;
      transition: all 0.15s;
    }

    .btn-odd {
      background: rgba(224,85,85,0.12);
      border-color: #e05555;
      color: #e05555;
    }

    .btn-odd:not(:disabled):hover {
      background: rgba(224,85,85,0.25);
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(224,85,85,0.3);
    }

    .btn-even {
      background: rgba(74,158,255,0.12);
      border-color: #4a9eff;
      color: #4a9eff;
    }

    .btn-even:not(:disabled):hover {
      background: rgba(74,158,255,0.25);
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(74,158,255,0.3);
    }

    .btn-odd:disabled, .btn-even:disabled { opacity: 0.4; cursor: not-allowed; }

    .odds-label {
      text-align: center;
      font-size: 0.75rem;
      color: #555;
      margin-top: 10px;
    }

    /* ─── 우측 배팅 슬립 ─── */
    .sidebar-right {
      background: #13192e;
      border-left: 1px solid #2a2a4a;
      display: flex;
      flex-direction: column;
    }

    .slip-header {
      background: linear-gradient(90deg, #b8941f, #c8a951);
      padding: 10px 16px;
      font-size: 0.88rem;
      font-weight: bold;
      color: #000;
      letter-spacing: 1px;
    }

    .slip-body { padding: 16px; flex: 1; }

    .slip-point-row {
      background: #0d0d1a;
      border: 1px solid #2a2a4a;
      border-radius: 4px;
      padding: 10px 12px;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .slip-point-label { font-size: 0.78rem; color: #888; }
    .slip-point-value { font-size: 1.1rem; color: #c8a951; font-weight: bold; }

    .slip-section-label {
      font-size: 0.75rem;
      color: #c8a951;
      margin-bottom: 8px;
    }

    .bet-quick-btns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 10px;
    }

    .bet-quick-btn {
      background: #1a2240;
      border: 1px solid #2a2a4a;
      border-radius: 4px;
      color: #ccc;
      padding: 7px;
      font-size: 0.8rem;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
    }

    .bet-quick-btn:hover { background: #243060; border-color: #c8a951; color: #c8a951; }

    .bet-input-row {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
    }

    .bet-input {
      flex: 1;
      background: #0d0d1a;
      border: 1px solid #2a2a4a;
      border-radius: 4px;
      padding: 9px 12px;
      color: #fff;
      font-size: 0.95rem;
      text-align: right;
      outline: none;
    }

    .bet-input:focus { border-color: #c8a951; }

    .bet-reset-btn {
      background: #1a2240;
      border: 1px solid #e05555;
      color: #e05555;
      padding: 9px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.8rem;
      transition: all 0.15s;
    }

    .bet-reset-btn:hover { background: rgba(224,85,85,0.15); }

    .slip-divider {
      border: none;
      border-top: 1px solid #2a2a4a;
      margin: 14px 0;
    }

    .slip-summary {
      display: flex;
      justify-content: space-between;
      font-size: 0.82rem;
      margin-bottom: 8px;
    }

    .slip-summary .label { color: #888; }
    .slip-summary .value { color: #fff; font-weight: bold; }
    .slip-summary .value.gold { color: #c8a951; }

    .btn-bet-now {
      width: 100%;
      padding: 13px;
      background: linear-gradient(90deg, #b8941f, #c8a951, #b8941f);
      border: none;
      border-radius: 4px;
      color: #000;
      font-size: 1rem;
      font-weight: 900;
      letter-spacing: 3px;
      cursor: pointer;
      margin-bottom: 10px;
      transition: opacity 0.2s;
    }

    .btn-bet-now:hover { opacity: 0.88; }
    .btn-bet-now:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-recharge-slip {
      width: 100%;
      padding: 9px;
      background: transparent;
      border: 1px solid #c8a951;
      color: #c8a951;
      border-radius: 4px;
      font-size: 0.82rem;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-recharge-slip:hover { background: rgba(200,169,81,0.1); }

    /* 최근 기록 */
    .history-panel {
      padding: 12px 16px;
      border-top: 1px solid #2a2a4a;
    }

    .history-panel-title {
      font-size: 0.75rem;
      color: #c8a951;
      margin-bottom: 8px;
    }

    .history-rows { display: flex; flex-direction: column; gap: 4px; max-height: 200px; overflow-y: auto; }
    .history-rows::-webkit-scrollbar { width: 3px; }
    .history-rows::-webkit-scrollbar-thumb { background: #c8a951; }

    .h-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 5px 8px;
      background: #0d0d1a;
      border-radius: 3px;
      font-size: 0.78rem;
      border-left: 2px solid transparent;
    }

    .h-row.win { border-left-color: #4ade80; }
    .h-row.lose { border-left-color: #e05555; }

    .h-num { font-weight: bold; width: 28px; }
    .h-num.odd { color: #e05555; }
    .h-num.even { color: #4a9eff; }
    .h-info { flex: 1; padding: 0 6px; color: #666; }
    .h-result { font-weight: bold; }
    .h-result.win { color: #4ade80; }
    .h-result.lose { color: #e05555; }

    .history-empty { color: #444; font-size: 0.78rem; text-align: center; padding: 10px 0; }

    .saving-indicator { font-size: 0.72rem; color: #c8a951; text-align: center; height: 16px; }

    /* 반응형 */
    @media (max-width: 900px) {
      .main-layout { grid-template-columns: 1fr; }
      .sidebar-left { display: none; }
      .sidebar-right { border-left: none; border-top: 1px solid #2a2a4a; }
    }
  </style>
</head>
<body>

  <!-- ══════════════════════════════
       로그인 화면
  ══════════════════════════════ -->
  <div id="loginScreen">
    <div class="login-wrap">
      <div class="login-logo-area">
        <h1>♠ KINGS</h1>
        <p>홀짝 게임 — 로그인하고 시작하세요</p>
      </div>

      <div class="login-card">
        <div class="tab-row">
          <button class="tab-btn active" id="tabLogin" onclick="switchTab('login')">로그인</button>
          <button class="tab-btn" id="tabRegister" onclick="switchTab('register')">회원가입</button>
        </div>

        <div class="field">
          <label>아이디</label>
          <input type="text" id="usernameInput" placeholder="아이디 입력" maxlength="16" autocomplete="username">
        </div>

        <div class="field">
          <label>비밀번호</label>
          <input type="password" id="passwordInput" placeholder="6자 이상" onkeydown="handleEnter(event)" autocomplete="current-password">
        </div>

        <div id="registerFields" style="display:none">
          <div class="field">
            <label>비밀번호 확인</label>
            <input type="password" id="passwordConfirmInput" placeholder="비밀번호를 다시 입력">
          </div>
          <div class="field">
            <label>닉네임</label>
            <input type="text" id="nicknameInput" placeholder="게임에서 표시될 이름" maxlength="12">
          </div>
          <div class="field">
            <label>휴대폰 번호</label>
            <input type="tel" id="phoneInput" placeholder="010-0000-0000" maxlength="13" oninput="formatPhone(this)">
          </div>
          <div class="field">
            <label>추천인 코드</label>
            <input type="text" id="referralInput" placeholder="추천인 코드 입력 (필수)" maxlength="16">
          </div>
        </div>

        <p class="error-msg" id="authError"></p>
        <button class="btn-login-submit" id="submitBtn" onclick="handleSubmit()">로그인</button>
      </div>
    </div>
  </div>

  <!-- ══════════════════════════════
       게임 화면
  ══════════════════════════════ -->
  <div id="gameScreen">

    <!-- 헤더 -->
    <header class="header">
      <div class="header-logo">♠ KINGS</div>
      <div class="header-user">
        <div class="user-point-box" id="headerPoints">0 P</div>
        <div class="myinfo-nickname" id="userNickname">—</div>
        <button class="btn-myinfo" onclick="openMyInfo()">👤 내정보</button>
        <button class="btn-logout-top" onclick="handleLogout()">로그아웃</button>
      </div>
    </header>

    <!-- 내정보 모달 -->
    <div class="modal-overlay" id="myInfoModal">
      <div class="modal-box">
        <div class="modal-header">
          <span>내 정보</span>
          <button class="modal-close" onclick="closeMyInfo()">✕</button>
        </div>
        <div class="modal-body">
          <div class="info-row">
            <span class="info-label">아이디</span>
            <span class="info-value" id="infoUsername">—</span>
          </div>
          <div class="info-row">
            <span class="info-label">닉네임</span>
            <span class="info-value" id="infoNickname">—</span>
          </div>
          <div class="info-row">
            <span class="info-label">휴대폰</span>
            <span class="info-value" id="infoPhone">—</span>
          </div>
          <div class="info-row">
            <span class="info-label">보유 포인트</span>
            <span class="info-value" id="infoPoints" style="color:#c8a951">—</span>
          </div>
          <div class="info-row">
            <span class="info-label">추천인</span>
            <span class="info-value" id="infoReferral">—</span>
          </div>
        </div>
      </div>
    </div>

    <!-- 서브 네비 -->
    <nav class="subnav">
      <button class="subnav-btn active">홀짝</button>
      <button class="subnav-btn">사다리</button>
      <button class="subnav-btn">달팽이</button>
      <button class="subnav-btn">파워볼</button>
      <button class="subnav-btn">스피드키노</button>
    </nav>

    <!-- 3단 레이아웃 -->
    <div class="main-layout">

      <!-- 좌측 사이드바 -->
      <aside class="sidebar-left">
        <div class="sidebar-section-title">GAME</div>
        <div class="sidebar-menu-item active">홀짝 <span class="sidebar-badge">LIVE</span></div>
        <div class="sidebar-menu-item">사다리</div>
        <div class="sidebar-menu-item">달팽이</div>
        <div class="sidebar-menu-item">파워볼</div>
        <div class="sidebar-menu-item">스피드키노</div>
        <div class="sidebar-section-title" style="margin-top:10px">MENU</div>
        <div class="sidebar-menu-item">마이페이지</div>
        <div class="sidebar-menu-item">배팅내역</div>
        <div class="sidebar-menu-item">고객센터</div>
      </aside>

      <!-- 메인 콘텐츠 -->
      <main class="main-content">
        <div class="content-header">
          <div class="content-title">게임</div>
          <div class="saving-indicator" id="savingIndicator"></div>
        </div>

        <div class="game-panel">
          <div class="game-panel-header">
            <div class="game-panel-title">게임을 선택해주세요</div>
          </div>
          <div class="game-panel-body" style="text-align:center;padding:60px 20px;color:#444;font-size:0.9rem;">
            좌측 메뉴에서 게임을 선택해주세요
          </div>
        </div>
      </main>

      <!-- 우측 배팅 슬립 -->
      <aside class="sidebar-right">
        <div class="slip-header">BETTING SLIP</div>
        <div class="slip-body">

          <div class="slip-point-row">
            <div class="slip-point-label">보유 포인트</div>
            <div class="slip-point-value" id="slipPoints">0 P</div>
          </div>

          <div class="slip-section-label">배팅 금액</div>
          <div class="bet-quick-btns">
            <button class="bet-quick-btn" onclick="addBet(1000)">+1,000</button>
            <button class="bet-quick-btn" onclick="addBet(5000)">+5,000</button>
            <button class="bet-quick-btn" onclick="addBet(10000)">+10,000</button>
            <button class="bet-quick-btn" onclick="setBetAll()">MAX</button>
          </div>

          <div class="bet-input-row">
            <input class="bet-input" type="number" id="betInput" placeholder="배팅 금액">
            <button class="bet-reset-btn" onclick="resetBet()">초기화</button>
          </div>

          <hr class="slip-divider">

          <div class="slip-summary">
            <span class="label">배팅액</span>
            <span class="value" id="summaryBet">0 P</span>
          </div>
          <div class="slip-summary">
            <span class="label">예상 당첨금</span>
            <span class="value gold" id="summaryWin">0 P</span>
          </div>

          <hr class="slip-divider">

          <button class="btn-recharge-slip" onclick="recharge()">+ 포인트 충전 (10,000P)</button>
        </div>

        <!-- 최근 기록 -->
        <div class="history-panel">
          <div class="history-panel-title">최근 배팅 기록</div>
          <div class="history-rows" id="historyList">
            <div class="history-empty">기록 없음</div>
          </div>
        </div>
      </aside>

    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDJv5VYIt2xFrQmignCwSzuThAkULz1NW8",
      authDomain: "kings-44a9b.firebaseapp.com",
      projectId: "kings-44a9b",
      storageBucket: "kings-44a9b.firebasestorage.app",
      messagingSenderId: "715133382138",
      appId: "1:715133382138:web:62cf478cc321fa418c0843"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let points = 0;
    let gameHistory = [];
    let currentUid = null;
    let currentUserData = {};

    window.openMyInfo = function() {
      document.getElementById('infoUsername').textContent  = currentUserData.username  || '—';
      document.getElementById('infoNickname').textContent  = currentUserData.nickname  || '—';
      document.getElementById('infoPhone').textContent     = currentUserData.phone     || '—';
      document.getElementById('infoPoints').textContent    = points.toLocaleString()   + ' P';
      document.getElementById('infoReferral').textContent  = currentUserData.referral  || '없음';
      document.getElementById('myInfoModal').classList.add('open');
    };

    window.closeMyInfo = function() {
      document.getElementById('myInfoModal').classList.remove('open');
    };

    document.getElementById('myInfoModal').addEventListener('click', function(e) {
      if (e.target === this) closeMyInfo();
    });

    // 배팅 입력 변화 감지 → 예상 당첨금 업데이트
    document.getElementById('betInput').addEventListener('input', updateSummary);

    function updateSummary() {
      const bet = getBet();
      document.getElementById('summaryBet').textContent = bet.toLocaleString() + ' P';
      document.getElementById('summaryWin').textContent = (bet * 2).toLocaleString() + ' P';
    }

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUid = user.uid;
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('gameScreen').style.display = 'flex';
        document.getElementById('gameScreen').style.flexDirection = 'column';
        await loadUserData(user.uid);
      } else {
        currentUid = null;
        document.getElementById('loginScreen').style.display = 'flex';
        document.getElementById('gameScreen').style.display = 'none';
      }
    });

    async function loadUserData(uid) {
      try {
        const snap = await getDoc(doc(db, 'users', uid));
        if (snap.exists()) {
          const data = snap.data();
          currentUserData = data;
          points = data.points ?? 10000;
          document.getElementById('userNickname').textContent = data.nickname || data.username || '유저';
        } else {
          points = 10000;
          const uname = auth.currentUser?.email?.split('@')[0] || '유저';
          document.getElementById('userNickname').textContent = uname;
          await setDoc(doc(db, 'users', uid), { username: uname, nickname: uname, points: 10000, createdAt: new Date() });
        }
        updatePointsDisplay();
      } catch(e) {
        console.error('Firestore 오류:', e);
        points = 10000;
        updatePointsDisplay();
      }
    }

    async function savePoints() {
      if (!currentUid) return;
      const ind = document.getElementById('savingIndicator');
      ind.textContent = '저장 중...';
      try {
        await updateDoc(doc(db, 'users', currentUid), { points });
        ind.textContent = '✓ 저장됨';
        setTimeout(() => { ind.textContent = ''; }, 1500);
      } catch(e) { ind.textContent = ''; }
    }

    function updatePointsDisplay() {
      const txt = points.toLocaleString() + ' P';
      document.getElementById('headerPoints').textContent = txt;
      document.getElementById('slipPoints').textContent = txt;
    }

    function toEmail(u) { return u.toLowerCase() + '@kings.com'; }

    window.formatPhone = function(el) {
      let v = el.value.replace(/\D/g,'');
      if (v.length <= 3) el.value = v;
      else if (v.length <= 7) el.value = v.slice(0,3)+'-'+v.slice(3);
      else el.value = v.slice(0,3)+'-'+v.slice(3,7)+'-'+v.slice(7,11);
    };

    window.switchTab = function(tab) {
      const isReg = tab === 'register';
      document.getElementById('tabLogin').classList.toggle('active', !isReg);
      document.getElementById('tabRegister').classList.toggle('active', isReg);
      document.getElementById('registerFields').style.display = isReg ? 'block' : 'none';
      document.getElementById('submitBtn').textContent = isReg ? '회원가입' : '로그인';
      document.getElementById('authError').textContent = '';
    };

    window.handleEnter = function(e) { if (e.key === 'Enter') handleSubmit(); };

    window.handleSubmit = async function() {
      const isReg = document.getElementById('tabRegister').classList.contains('active');
      const username = document.getElementById('usernameInput').value.trim();
      const password = document.getElementById('passwordInput').value;
      const btn = document.getElementById('submitBtn');
      const errEl = document.getElementById('authError');
      errEl.textContent = '';
      if (!username || !password) { errEl.textContent = '아이디와 비밀번호를 입력해주세요.'; return; }
      btn.disabled = true; btn.textContent = '처리 중...';
      try {
        if (isReg) {
          const confirm = document.getElementById('passwordConfirmInput').value;
          const nickname = document.getElementById('nicknameInput').value.trim();
          const phone = document.getElementById('phoneInput').value.trim();
          const referral = document.getElementById('referralInput').value.trim();
          if (password !== confirm) { errEl.textContent = '비밀번호가 일치하지 않습니다.'; return; }
          if (!nickname) { errEl.textContent = '닉네임을 입력해주세요.'; return; }
          if (!/^010-\d{4}-\d{4}$/.test(phone)) { errEl.textContent = '올바른 휴대폰 번호를 입력해주세요.'; return; }
          if (!referral) { errEl.textContent = '추천인 코드를 입력해주세요.'; return; }
          if (referral !== '1111') { errEl.textContent = '유효하지 않은 추천인 코드입니다.'; return; }
          const cred = await createUserWithEmailAndPassword(auth, toEmail(username), password);
          await setDoc(doc(db, 'users', cred.user.uid), { username, nickname, phone, referral, points: 10000, createdAt: new Date() });
        } else {
          await signInWithEmailAndPassword(auth, toEmail(username), password);
        }
      } catch(e) {
        console.error('Auth 오류:', e.code, e.message);
        errEl.textContent = parseAuthError(e.code);
      } finally {
        btn.disabled = false;
        btn.textContent = isReg ? '회원가입' : '로그인';
      }
    };

    function parseAuthError(code) {
      const m = {
        'auth/invalid-credential': '아이디 또는 비밀번호가 틀렸습니다.',
        'auth/user-not-found': '존재하지 않는 아이디입니다.',
        'auth/wrong-password': '비밀번호가 틀렸습니다.',
        'auth/email-already-in-use': '이미 사용 중인 아이디입니다.',
        'auth/weak-password': '비밀번호는 6자 이상이어야 합니다.',
        'auth/too-many-requests': '잠시 후 다시 시도해주세요.',
        'auth/operation-not-allowed': 'Firebase 이메일 로그인을 활성화해주세요.',
      };
      return m[code] ?? `오류: ${code}`;
    }

    window.handleLogout = async function() {
      await signOut(auth);
      gameHistory = [];
      renderHistory();
      document.getElementById('resultArea').innerHTML = '<div class="idle-text">배팅 후 버튼을 눌러 게임을 시작하세요</div>';
    };

    function getBet() {
      const v = parseInt(document.getElementById('betInput').value, 10);
      return isNaN(v) || v <= 0 ? 0 : v;
    }

    window.addBet = function(n) { document.getElementById('betInput').value = getBet() + n; updateSummary(); };
    window.setBetAll = function() { document.getElementById('betInput').value = points; updateSummary(); };
    window.resetBet = function() { document.getElementById('betInput').value = ''; updateSummary(); };

    window.recharge = async function() {
      points += 10000;
      updatePointsDisplay();
      await savePoints();
    };

    function renderHistory() {
      const list = document.getElementById('historyList');
      if (!gameHistory.length) { list.innerHTML = '<div class="history-empty">기록 없음</div>'; return; }
      list.innerHTML = gameHistory.slice(0, 20).map(h => `
        <div class="h-row ${h.isWin ? 'win' : 'lose'}">
          <span class="h-num ${h.cls}">${h.number}</span>
          <span class="h-info">${h.choice} / ${h.bet.toLocaleString()}P</span>
          <span class="h-result ${h.isWin ? 'win' : 'lose'}">${h.isWin ? '▲' : '▼'}${Math.abs(h.payout).toLocaleString()}</span>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
