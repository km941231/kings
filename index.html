<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KINGS - 홀짝</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #1a1a2e;
      font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
      color: #ccc;
      min-height: 100vh;
    }

    /* 초기 로딩 화면 */
    #loadingScreen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #0d0d1a;
      flex-direction: column;
      gap: 16px;
    }

    .loading-logo {
      font-size: 2rem;
      font-weight: 900;
      color: #c8a951;
      letter-spacing: 6px;
    }

    .loading-spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #2a2a4a;
      border-top-color: #c8a951;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ══════════════════════════════
       로그인 화면
    ══════════════════════════════ */
    #loginScreen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #0d0d1a, #1a1a2e);
      padding: 20px;
    }

    .login-wrap { width: 100%; max-width: 420px; }

    .login-logo-area {
      text-align: center;
      margin-bottom: 30px;
    }

    .login-logo-area h1 {
      font-size: 2.2rem;
      font-weight: 900;
      color: #c8a951;
      letter-spacing: 6px;
      text-shadow: 0 0 20px rgba(200,169,81,0.5);
    }

    .login-logo-area p {
      color: #888;
      font-size: 0.85rem;
      margin-top: 6px;
    }

    .login-card {
      background: #16213e;
      border: 1px solid #2a2a4a;
      border-radius: 8px;
      padding: 28px 24px;
    }

    .tab-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      margin-bottom: 24px;
      border: 1px solid #2a2a4a;
      border-radius: 4px;
      overflow: hidden;
    }

    .tab-btn {
      padding: 10px;
      border: none;
      background: #0d0d1a;
      color: #666;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: #c8a951;
      color: #000;
      font-weight: bold;
    }

    .field { margin-bottom: 12px; }

    .field label {
      display: block;
      font-size: 0.78rem;
      color: #c8a951;
      margin-bottom: 5px;
    }

    .field input {
      width: 100%;
      background: #0d0d1a;
      border: 1px solid #2a2a4a;
      border-radius: 4px;
      padding: 10px 12px;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
    }

    .field input:focus { border-color: #c8a951; }
    .field input::placeholder { color: #444; }

    .error-msg {
      font-size: 0.8rem;
      color: #e05555;
      min-height: 18px;
      margin-bottom: 10px;
      text-align: center;
    }

    .btn-login-submit {
      width: 100%;
      padding: 12px;
      background: linear-gradient(90deg, #b8941f, #c8a951, #b8941f);
      border: none;
      border-radius: 4px;
      color: #000;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      letter-spacing: 2px;
      transition: opacity 0.2s;
    }

    .btn-login-submit:hover { opacity: 0.88; }
    .btn-login-submit:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ══════════════════════════════
       게임 화면 전체 레이아웃
    ══════════════════════════════ */
    #gameScreen { display: none; flex-direction: column; min-height: 100vh; }

    /* ─── 상단 헤더 ─── */
    .header {
      background: linear-gradient(90deg, #0d0d1a, #16213e, #0d0d1a);
      border-bottom: 2px solid #c8a951;
      padding: 0 16px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-logo {
      font-size: 1.6rem;
      font-weight: 900;
      color: #c8a951;
      letter-spacing: 4px;
      text-shadow: 0 0 10px rgba(200,169,81,0.4);
    }

    .header-user {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 0.85rem;
    }

    .user-point-box {
      background: #0d0d1a;
      border: 1px solid #c8a951;
      border-radius: 4px;
      padding: 5px 14px;
      color: #c8a951;
      font-weight: bold;
    }

    .user-name-box {
      color: #ccc;
    }

    .user-name-box span { color: #fff; font-weight: bold; }

    .btn-logout-top {
      background: transparent;
      border: 1px solid #444;
      color: #888;
      padding: 5px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.8rem;
      transition: all 0.2s;
    }

    .btn-logout-top:hover { border-color: #e05555; color: #e05555; }

    .btn-myinfo {
      background: #1a2240;
      border: 1px solid #c8a951;
      color: #c8a951;
      padding: 5px 14px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: bold;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-myinfo:hover { background: rgba(200,169,81,0.15); }

    .myinfo-nickname {
      color: #fff;
      font-weight: bold;
      font-size: 0.88rem;
      background: #0d0d1a;
      border: 1px solid #2a2a4a;
      border-radius: 4px;
      padding: 4px 12px;
    }

    /* 내정보 모달 */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 999;
      align-items: center;
      justify-content: center;
    }

    .modal-overlay.open { display: flex; }

    .modal-box {
      background: #16213e;
      border: 1px solid #c8a951;
      border-radius: 8px;
      width: 100%;
      max-width: 360px;
      overflow: hidden;
    }

    .modal-header {
      background: linear-gradient(90deg, #b8941f, #c8a951);
      padding: 12px 18px;
      font-size: 0.9rem;
      font-weight: bold;
      color: #000;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-close {
      background: none;
      border: none;
      color: #000;
      font-size: 1.1rem;
      cursor: pointer;
      font-weight: bold;
    }

    .modal-body { padding: 20px; }

    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #1e2a3a;
      font-size: 0.85rem;
    }

    .info-row:last-child { border-bottom: none; }
    .info-label { color: #888; }
    .info-value { color: #fff; font-weight: bold; }

    /* ─── 서브 네비 ─── */
    .subnav {
      background: #16213e;
      border-bottom: 1px solid #2a2a4a;
      display: flex;
      align-items: center;
      padding: 0 16px;
      height: 38px;
      gap: 4px;
      overflow-x: auto;
    }

    .subnav::-webkit-scrollbar { height: 3px; }
    .subnav::-webkit-scrollbar-thumb { background: #c8a951; }

    .subnav-btn {
      padding: 6px 16px;
      background: transparent;
      border: 1px solid #2a2a4a;
      border-radius: 3px;
      color: #888;
      font-size: 0.82rem;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
    }

    .subnav-btn:hover { background: #1e2a4a; color: #ccc; }

    .subnav-btn.active {
      background: #c8a951;
      border-color: #c8a951;
      color: #000;
      font-weight: bold;
    }

    /* ─── 3단 레이아웃 ─── */
    .main-layout {
      display: grid;
      grid-template-columns: 180px 1fr 280px;
      flex: 1;
      min-height: 0;
    }

    /* ─── 좌측 사이드바 ─── */
    .sidebar-left {
      background: #13192e;
      border-right: 1px solid #2a2a4a;
      padding: 12px 0;
    }

    .sidebar-section-title {
      font-size: 0.7rem;
      color: #c8a951;
      letter-spacing: 1px;
      padding: 8px 14px 4px;
      border-bottom: 1px solid #1e2440;
    }

    .sidebar-menu-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 14px;
      font-size: 0.83rem;
      color: #888;
      cursor: pointer;
      border-left: 3px solid transparent;
      transition: all 0.15s;
    }

    .sidebar-menu-item:hover { background: #1a2240; color: #ccc; }

    .sidebar-menu-item.active {
      background: #1a2240;
      color: #c8a951;
      border-left-color: #c8a951;
      font-weight: bold;
    }

    .sidebar-badge {
      background: #c8a951;
      color: #000;
      font-size: 0.65rem;
      padding: 1px 6px;
      border-radius: 10px;
      font-weight: bold;
    }

    /* ─── 메인 콘텐츠 ─── */
    .main-content {
      padding: 16px;
      overflow-y: auto;
    }

    .content-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .content-title {
      font-size: 1rem;
      color: #c8a951;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .content-title::before {
      content: '';
      display: inline-block;
      width: 4px;
      height: 16px;
      background: #c8a951;
      border-radius: 2px;
    }

    /* ─── 게임 패널 ─── */
    .game-panel {
      background: #13192e;
      border: 1px solid #2a2a4a;
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .game-panel-header {
      background: linear-gradient(90deg, #1a2240, #16213e);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #2a2a4a;
    }

    .game-panel-title {
      font-size: 0.88rem;
      font-weight: bold;
      color: #e0c87a;
    }

    .game-panel-body { padding: 20px; }

    /* 숫자 결과창 */
    .result-display {
      background: #0d0d1a;
      border: 1px solid #2a2a4a;
      border-radius: 6px;
      padding: 24px;
      text-align: center;
      margin-bottom: 20px;
      min-height: 130px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .result-number {
      font-size: 5rem;
      font-weight: 900;
      line-height: 1;
      margin-bottom: 8px;
    }

    .result-number.odd { color: #e05555; text-shadow: 0 0 20px rgba(224,85,85,0.5); }
    .result-number.even { color: #4a9eff; text-shadow: 0 0 20px rgba(74,158,255,0.5); }
    .result-number.rolling { animation: roll 0.08s infinite alternate; }

    @keyframes roll { from { transform: scale(1); } to { transform: scale(1.08); } }

    .result-tag { font-size: 1.1rem; font-weight: bold; letter-spacing: 2px; }
    .result-tag.odd { color: #e05555; }
    .result-tag.even { color: #4a9eff; }

    .result-outcome {
      font-size: 1.4rem;
      font-weight: bold;
      margin-top: 6px;
    }

    .result-outcome.win { color: #4ade80; animation: pop 0.3s ease-out; }
    .result-outcome.lose { color: #e05555; }

    @keyframes pop { 0% { transform: scale(0.7); } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }

    .result-change { font-size: 0.9rem; color: #888; margin-top: 4px; }
    .idle-text { color: #444; font-size: 0.9rem; }

    /* 홀짝 선택 버튼 */
    .choice-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn-odd, .btn-even {
      padding: 18px;
      border-radius: 5px;
      border: 1px solid;
      cursor: pointer;
      font-size: 1.2rem;
      font-weight: bold;
      letter-spacing: 2px;
      transition: all 0.15s;
    }

    .btn-odd {
      background: rgba(224,85,85,0.12);
      border-color: #e05555;
      color: #e05555;
    }

    .btn-odd:not(:disabled):hover {
      background: rgba(224,85,85,0.25);
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(224,85,85,0.3);
    }

    .btn-even {
      background: rgba(74,158,255,0.12);
      border-color: #4a9eff;
      color: #4a9eff;
    }

    .btn-even:not(:disabled):hover {
      background: rgba(74,158,255,0.25);
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(74,158,255,0.3);
    }

    .btn-odd:disabled, .btn-even:disabled { opacity: 0.4; cursor: not-allowed; }

    .odds-label {
      text-align: center;
      font-size: 0.75rem;
      color: #555;
      margin-top: 10px;
    }

    /* ─── 우측 배팅 슬립 ─── */
    .sidebar-right {
      background: #13192e;
      border-left: 1px solid #2a2a4a;
      display: flex;
      flex-direction: column;
    }

    .slip-header {
      background: linear-gradient(90deg, #b8941f, #c8a951);
      padding: 10px 16px;
      font-size: 0.88rem;
      font-weight: bold;
      color: #000;
      letter-spacing: 1px;
    }

    .slip-body { padding: 16px; flex: 1; }

    .slip-point-row {
      background: #0d0d1a;
      border: 1px solid #2a2a4a;
      border-radius: 4px;
      padding: 10px 12px;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .slip-point-label { font-size: 0.78rem; color: #888; }
    .slip-point-value { font-size: 1.1rem; color: #c8a951; font-weight: bold; }

    .slip-section-label {
      font-size: 0.75rem;
      color: #c8a951;
      margin-bottom: 8px;
    }

    .bet-quick-btns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 10px;
    }

    .bet-quick-btn {
      background: #1a2240;
      border: 1px solid #2a2a4a;
      border-radius: 4px;
      color: #ccc;
      padding: 7px;
      font-size: 0.8rem;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
    }

    .bet-quick-btn:hover { background: #243060; border-color: #c8a951; color: #c8a951; }

    .bet-input-row {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
    }

    .bet-input {
      flex: 1;
      background: #0d0d1a;
      border: 1px solid #2a2a4a;
      border-radius: 4px;
      padding: 9px 12px;
      color: #fff;
      font-size: 0.95rem;
      text-align: right;
      outline: none;
    }

    .bet-input:focus { border-color: #c8a951; }

    .bet-reset-btn {
      background: #1a2240;
      border: 1px solid #e05555;
      color: #e05555;
      padding: 9px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.8rem;
      transition: all 0.15s;
    }

    .bet-reset-btn:hover { background: rgba(224,85,85,0.15); }

    .slip-divider {
      border: none;
      border-top: 1px solid #2a2a4a;
      margin: 14px 0;
    }

    .slip-summary {
      display: flex;
      justify-content: space-between;
      font-size: 0.82rem;
      margin-bottom: 8px;
    }

    .slip-summary .label { color: #888; }
    .slip-summary .value { color: #fff; font-weight: bold; }
    .slip-summary .value.gold { color: #c8a951; }

    .btn-bet-now {
      width: 100%;
      padding: 13px;
      background: linear-gradient(90deg, #b8941f, #c8a951, #b8941f);
      border: none;
      border-radius: 4px;
      color: #000;
      font-size: 1rem;
      font-weight: 900;
      letter-spacing: 3px;
      cursor: pointer;
      margin-bottom: 10px;
      transition: opacity 0.2s;
    }

    .btn-bet-now:hover { opacity: 0.88; }
    .btn-bet-now:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-recharge-slip {
      width: 100%;
      padding: 9px;
      background: transparent;
      border: 1px solid #c8a951;
      color: #c8a951;
      border-radius: 4px;
      font-size: 0.82rem;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-recharge-slip:hover { background: rgba(200,169,81,0.1); }

    /* 최근 기록 */
    .history-panel {
      padding: 12px 16px;
      border-top: 1px solid #2a2a4a;
    }

    .history-panel-title {
      font-size: 0.75rem;
      color: #c8a951;
      margin-bottom: 8px;
    }

    .history-rows { display: flex; flex-direction: column; gap: 4px; max-height: 200px; overflow-y: auto; }
    .history-rows::-webkit-scrollbar { width: 3px; }
    .history-rows::-webkit-scrollbar-thumb { background: #c8a951; }

    .h-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 5px 8px;
      background: #0d0d1a;
      border-radius: 3px;
      font-size: 0.78rem;
      border-left: 2px solid transparent;
    }

    .h-row.win { border-left-color: #4ade80; }
    .h-row.lose { border-left-color: #e05555; }

    .h-num { font-weight: bold; width: 28px; }
    .h-num.odd { color: #e05555; }
    .h-num.even { color: #4a9eff; }
    .h-info { flex: 1; padding: 0 6px; color: #666; }
    .h-result { font-weight: bold; }
    .h-result.win { color: #4ade80; }
    .h-result.lose { color: #e05555; }

    .history-empty { color: #444; font-size: 0.78rem; text-align: center; padding: 10px 0; }

    .saving-indicator { font-size: 0.72rem; color: #c8a951; text-align: center; height: 16px; }

    /* 반응형 */
    @media (max-width: 900px) {
      .main-layout { grid-template-columns: 1fr; }
      .sidebar-left { display: none; }
      .sidebar-right { border-left: none; border-top: 1px solid #2a2a4a; }
    }

    /* ─── 사다리 게임 ─── */
    .lg-layout { display: grid; grid-template-columns: 155px 1fr 165px; gap: 10px; }
    .lg-panel { background: #13192e; border: 1px solid #2a2a4a; border-radius: 6px; overflow: hidden; }
    .lg-panel-title {
      background: linear-gradient(90deg, #1a2240, #16213e);
      padding: 9px 14px; font-size: 0.85rem; font-weight: bold;
      color: #e0c87a; border-bottom: 1px solid #2a2a4a; text-align: center;
    }
    .lg-sub-title { font-size: 0.72rem; color: #888; text-align: center; padding: 5px 8px; border-bottom: 1px solid #1a2030; }

    .lg-pick-item { display: flex; align-items: center; gap: 6px; padding: 7px 10px; border-bottom: 1px solid #1a2030; }
    .lg-pick-num {
      background: #c0392b; color: #fff; font-size: 0.68rem; font-weight: bold;
      width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center;
      justify-content: center; flex-shrink: 0;
    }
    .lg-pick-info { flex: 1; color: #777; font-size: 0.7rem; line-height: 1.5; }
    .lg-pick-badge { font-size: 0.73rem; font-weight: bold; padding: 3px 8px; border-radius: 10px; flex-shrink: 0; }
    .lg-pick-badge.hol { background: rgba(224,85,85,0.2); color: #e05555; border: 1px solid rgba(224,85,85,0.35); }
    .lg-pick-badge.jjak { background: rgba(74,158,255,0.18); color: #4a9eff; border: 1px solid rgba(74,158,255,0.35); }

    .lg-game-title { text-align: center; font-size: 0.88rem; color: #c8a951; font-weight: bold; padding: 10px; border-bottom: 1px solid #1a2030; }
    .lg-datetime { text-align: center; font-size: 0.72rem; color: #555; padding: 4px; }
    .lg-canvas-wrap { display: flex; justify-content: center; padding: 6px 0; background: #0d0d1a; }

    .lg-stats { padding: 8px 12px; }
    .lg-stat-row { display: flex; align-items: center; gap: 5px; margin-bottom: 5px; font-size: 0.72rem; }
    .lg-stat-lbl { color: #888; width: 26px; text-align: center; flex-shrink: 0; font-size: 0.68rem; }
    .lg-bar-track { flex: 1; height: 13px; background: #0d0d1a; border-radius: 2px; overflow: hidden; display: flex; }
    .lg-bar-hol { background: #e05555; height: 100%; transition: width 0.5s; }
    .lg-bar-jjak { background: #4a9eff; height: 100%; flex: 1; }
    .lg-pct-hol { color: #e05555; font-size: 0.7rem; width: 36px; text-align: right; flex-shrink: 0; }
    .lg-pct-jjak { color: #4a9eff; font-size: 0.7rem; width: 36px; flex-shrink: 0; }

    .lg-countdown {
      text-align: center; background: linear-gradient(90deg, #0d0d1a, #13192e, #0d0d1a);
      padding: 8px; font-size: 0.82rem; color: #c8a951; font-weight: bold;

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDJv5VYIt2xFrQmignCwSzuThAkULz1NW8",
      authDomain: "kings-44a9b.firebaseapp.com",
      projectId: "kings-44a9b",
      storageBucket: "kings-44a9b.firebasestorage.app",
      messagingSenderId: "715133382138",
      appId: "1:715133382138:web:62cf478cc321fa418c0843"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let points = 0;
    let gameHistory = [];
    let currentUid = null;
    let currentUserData = {};


    // 배팅 입력 변화 감지 → 예상 당첨금 업데이트
    document.getElementById('betInput').addEventListener('input', updateSummary);

    function updateSummary() {
      const bet = getBet();
      document.getElementById('summaryBet').textContent = bet.toLocaleString() + ' P';
      document.getElementById('summaryWin').textContent = (bet * 2).toLocaleString() + ' P';
    }

    onAuthStateChanged(auth, async (user) => {
      document.getElementById('loadingScreen').style.display = 'none';
      if (user) {
        currentUid = user.uid;
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('gameScreen').style.display = 'flex';
        document.getElementById('gameScreen').style.flexDirection = 'column';
        await loadUserData(user.uid);
      } else {
        currentUid = null;
        document.getElementById('loginScreen').style.display = 'flex';
        document.getElementById('gameScreen').style.display = 'none';
      }
    });

    async function loadUserData(uid) {
      try {
        const snap = await getDoc(doc(db, 'users', uid));
        if (snap.exists()) {
          const data = snap.data();
          currentUserData = data;
          points = data.points ?? 10000;
          document.getElementById('userNickname').textContent = data.nickname || data.username || '유저';
          if (data.isAdmin) {
            document.getElementById('btnAdmin').style.display = 'flex';
          }
        } else {
          const uname = auth.currentUser?.email?.split('@')[0] || '유저';
          currentUserData = { username: uname, nickname: uname, phone: '—', referral: '—', points: 10000 };
          points = 10000;
          document.getElementById('userNickname').textContent = uname;
          await setDoc(doc(db, 'users', uid), currentUserData);
        }
        // 내정보 페이지에서 사용할 수 있도록 저장
        sessionStorage.setItem('userData', JSON.stringify({ ...currentUserData, points }));
        updatePointsDisplay();
      } catch(e) {
        console.error('Firestore 오류:', e);
        points = 10000;
        updatePointsDisplay();
      }
    }

    async function savePoints() {
      if (!currentUid) return;
      const ind = document.getElementById('savingIndicator');
      ind.textContent = '저장 중...';
      try {
        await updateDoc(doc(db, 'users', currentUid), { points });
        ind.textContent = '✓ 저장됨';
        setTimeout(() => { ind.textContent = ''; }, 1500);
      } catch(e) { ind.textContent = ''; }
    }

    function updatePointsDisplay() {
      const txt = points.toLocaleString() + ' P';
      document.getElementById('headerPoints').textContent = txt;
      document.getElementById('slipPoints').textContent = txt;
    }

    function toEmail(u) { return u.toLowerCase() + '@kings.com'; }

    window.formatPhone = function(el) {
      let v = el.value.replace(/\D/g,'');
      if (v.length <= 3) el.value = v;
      else if (v.length <= 7) el.value = v.slice(0,3)+'-'+v.slice(3);
      else el.value = v.slice(0,3)+'-'+v.slice(3,7)+'-'+v.slice(7,11);
    };

    window.switchTab = function(tab) {
      const isReg = tab === 'register';
      document.getElementById('tabLogin').classList.toggle('active', !isReg);
      document.getElementById('tabRegister').classList.toggle('active', isReg);
      document.getElementById('registerFields').style.display = isReg ? 'block' : 'none';
      document.getElementById('submitBtn').textContent = isReg ? '회원가입' : '로그인';
      document.getElementById('authError').textContent = '';
    };

    window.handleEnter = function(e) { if (e.key === 'Enter') handleSubmit(); };

    window.handleSubmit = async function() {
      const isReg = document.getElementById('tabRegister').classList.contains('active');
      const username = document.getElementById('usernameInput').value.trim();
      const password = document.getElementById('passwordInput').value;
      const btn = document.getElementById('submitBtn');
      const errEl = document.getElementById('authError');
      errEl.textContent = '';
      if (!username || !password) { errEl.textContent = '아이디와 비밀번호를 입력해주세요.'; return; }
      btn.disabled = true; btn.textContent = '처리 중...';
      try {
        if (isReg) {
          const confirm = document.getElementById('passwordConfirmInput').value;
          const nickname = document.getElementById('nicknameInput').value.trim();
          const phone = document.getElementById('phoneInput').value.trim();
          const referral = document.getElementById('referralInput').value.trim();
          if (password !== confirm) { errEl.textContent = '비밀번호가 일치하지 않습니다.'; return; }
          if (!nickname) { errEl.textContent = '닉네임을 입력해주세요.'; return; }
          if (!/^010-\d{4}-\d{4}$/.test(phone)) { errEl.textContent = '올바른 휴대폰 번호를 입력해주세요.'; return; }
          if (!referral) { errEl.textContent = '추천인 코드를 입력해주세요.'; return; }
          // Firestore에서 코드 유효성 검사
          const codeSnap = await getDoc(doc(db, 'referralCodes', referral.toUpperCase()));
          if (!codeSnap.exists()) { errEl.textContent = '유효하지 않은 추천인 코드입니다.'; return; }
          const cred = await createUserWithEmailAndPassword(auth, toEmail(username), password);
          await setDoc(doc(db, 'users', cred.user.uid), { username, nickname, phone, referral, points: 10000, createdAt: new Date() });
          await signOut(auth);
          errEl.style.color = '#4ade80';
          errEl.textContent = '회원가입이 완료됐습니다! 로그인해주세요.';
          switchTab('login');
          document.getElementById('usernameInput').value = username;
          btn.disabled = false;
          btn.textContent = '회원가입';
          return;
        } else {
          await signInWithEmailAndPassword(auth, toEmail(username), password);
        }
      } catch(e) {
        console.error('Auth 오류:', e.code, e.message);
        errEl.textContent = parseAuthError(e.code);
      } finally {
        btn.disabled = false;
        btn.textContent = isReg ? '회원가입' : '로그인';
      }
    };

    function parseAuthError(code) {
      const m = {
        'auth/invalid-credential': '아이디 또는 비밀번호가 틀렸습니다.',
        'auth/user-not-found': '존재하지 않는 아이디입니다.',
        'auth/wrong-password': '비밀번호가 틀렸습니다.',
        'auth/email-already-in-use': '이미 사용 중인 아이디입니다.',
        'auth/weak-password': '비밀번호는 6자 이상이어야 합니다.',
        'auth/too-many-requests': '잠시 후 다시 시도해주세요.',
        'auth/operation-not-allowed': 'Firebase 이메일 로그인을 활성화해주세요.',
      };
      return m[code] ?? `오류: ${code}`;
    }

    window.handleLogout = async function() {
      await signOut(auth);
      gameHistory = [];
      renderHistory();
      document.getElementById('resultArea').innerHTML = '<div class="idle-text">배팅 후 버튼을 눌러 게임을 시작하세요</div>';
    };

    function getBet() {
      const v = parseInt(document.getElementById('betInput').value, 10);
      return isNaN(v) || v <= 0 ? 0 : v;
    }

    window.addBet = function(n) { document.getElementById('betInput').value = getBet() + n; updateSummary(); };
    window.setBetAll = function() { document.getElementById('betInput').value = points; updateSummary(); };
    window.resetBet = function() { document.getElementById('betInput').value = ''; updateSummary(); };

    window.recharge = async function() {
      points += 10000;
      updatePointsDisplay();
      await savePoints();
    };

    // ═══════════════════════════════════════
    // 게임 선택
    // ═══════════════════════════════════════
    window.selectGame = function(game) {
      document.getElementById('panelSelect').style.display  = game === ''       ? '' : 'none';
      document.getElementById('panelLadder').style.display  = game === 'ladder' ? '' : 'none';

      document.querySelectorAll('.sidebar-menu-item').forEach(el => el.classList.remove('active'));
      if (game === '')       document.getElementById('menuHolJjak').classList.add('active');
      if (game === 'ladder') document.getElementById('menuLadder').classList.add('active');

      if (game === 'ladder') initLadderGame();
    };

    // ═══════════════════════════════════════
    // 사다리 게임
    // ═══════════════════════════════════════
    const LG = {
      ctx: null, animFrame: null, timer: null,
      round: 0, betChoice: null, isAnimating: false,
      pendingAnimate: false
    };

    function lgHash(n) {
      let h = n ^ 0xdeadbeef;
      h = Math.imul(h ^ (h >>> 16), 0x45d9f3b);
      h = Math.imul(h ^ (h >>> 15), 0xc2b2ae35);
      return ((h ^ (h >>> 16)) >>> 0) / 0xffffffff;
    }

    function getLGRound() {
      const d = new Date();
      return d.getHours() * 60 + d.getMinutes() + 1;
    }

    function getLGResult(round) {
      const bars = Array.from({ length: 5 }, (_, i) => lgHash(round * 1000 + i * 137 + 7) > 0.5);
      const startLeft = lgHash(round * 777 + 99) > 0.5;
      let posLeft = startLeft;
      bars.forEach(b => { if (b) posLeft = !posLeft; });
      return { bars, startLeft, result: posLeft ? '홀' : '짝' };
    }

    function lgStats(beforeRound, n = 50) {
      let hol = 0;
      for (let i = 1; i <= n; i++) hol += getLGResult(beforeRound - i).result === '홀' ? 1 : 0;
      return { holPct: (hol / n * 100).toFixed(2), jjakPct: ((n - hol) / n * 100).toFixed(2) };
    }

    function lgDraw(bars, startLeft, charX, charY) {
      const c = LG.ctx;
      const W = 260, H = 310;
      const LX = 72, RX = 188;
      const ROWS = [75, 113, 151, 189, 227];
      const TOP = 28, BOT = 268;

      c.clearRect(0, 0, W, H);
      c.fillStyle = '#0d0d1a';
      c.fillRect(0, 0, W, H);

      // poles
      c.strokeStyle = '#4a5568'; c.lineWidth = 5;
      [[LX],[RX]].forEach(([x]) => {
        c.beginPath(); c.moveTo(x, TOP); c.lineTo(x, BOT); c.stroke();
      });

      // rungs
      c.strokeStyle = '#c8a951'; c.lineWidth = 3;
      bars.forEach((b, i) => {
        if (!b) return;
        c.beginPath(); c.moveTo(LX, ROWS[i]); c.lineTo(RX, ROWS[i]); c.stroke();
      });

      // X circles at top
      [LX, RX].forEach((x, idx) => {
        const active = idx === 0 ? startLeft : !startLeft;
        c.fillStyle = active ? '#555' : '#2a2a4a';
        c.beginPath(); c.arc(x, TOP - 14, 13, 0, Math.PI * 2); c.fill();
        c.strokeStyle = active ? '#888' : '#444'; c.lineWidth = 1.5;
        c.stroke();
        c.strokeStyle = active ? '#ccc' : '#555'; c.lineWidth = 2;
        c.beginPath();
        c.moveTo(x - 5, TOP - 19); c.lineTo(x + 5, TOP - 9);
        c.moveTo(x + 5, TOP - 19); c.lineTo(x - 5, TOP - 9);
        c.stroke();
      });

      // 홀/짝 at bottom
      [[LX, '홀', '#e05555'], [RX, '짝', '#4a9eff']].forEach(([x, lbl, col]) => {
        c.fillStyle = col;
        c.beginPath(); c.arc(x, BOT + 18, 16, 0, Math.PI * 2); c.fill();
        c.fillStyle = '#fff'; c.font = 'bold 12px Malgun Gothic, sans-serif';
        c.textAlign = 'center'; c.textBaseline = 'middle';
        c.fillText(lbl, x, BOT + 18);
      });

      // character
      if (charX !== null) {
        c.fillStyle = '#c8a951';
        c.beginPath(); c.arc(charX, charY, 11, 0, Math.PI * 2); c.fill();
        c.fillStyle = '#0d0d1a'; c.font = 'bold 11px sans-serif';
        c.textAlign = 'center'; c.textBaseline = 'middle';
        c.fillText('▼', charX, charY);
      }
    }

    function lgAnimate(round, onDone) {
      if (LG.animFrame) cancelAnimationFrame(LG.animFrame);
      LG.isAnimating = true;
      const { bars, startLeft } = getLGResult(round);
      const LX = 72, RX = 188;
      const ROWS = [75, 113, 151, 189, 227];
      const TOP = 28, BOT = 268;

      const path = [];
      let cx = startLeft ? LX : RX;
      path.push({ x: cx, y: TOP - 14 });
      ROWS.forEach((ry, i) => {
        path.push({ x: cx, y: ry });
        if (bars[i]) { cx = cx === LX ? RX : LX; path.push({ x: cx, y: ry }); }
      });
      path.push({ x: cx, y: BOT });

      const totalDist = path.reduce((acc, pt, i) => {
        if (i === 0) return 0;
        return acc + Math.hypot(pt.x - path[i-1].x, pt.y - path[i-1].y);
      }, 0);
      const speed = totalDist / 2800; // px per ms

      let seg = 0, t = 0, last = null;

      function frame(ts) {
        if (!last) last = ts;
        const dt = Math.min(ts - last, 50);
        last = ts;

        if (seg >= path.length - 1) {
          lgDraw(bars, startLeft, path[path.length-1].x, path[path.length-1].y);
          LG.isAnimating = false;
          if (onDone) onDone();
          return;
        }

        const from = path[seg], to = path[seg+1];
        const segDist = Math.hypot(to.x - from.x, to.y - from.y) || 1;
        t += (speed * dt) / segDist;
        if (t >= 1) { t = 0; seg++; }

        const px = from.x + (to.x - from.x) * t;
        const py = from.y + (to.y - from.y) * t;
        lgDraw(bars, startLeft, px, py);
        LG.animFrame = requestAnimationFrame(frame);
      }
      LG.animFrame = requestAnimationFrame(frame);
    }

    function lgNow() {
      const d = new Date();
      const p = n => String(n).padStart(2,'0');
      return `${d.getFullYear()}.${p(d.getMonth()+1)}.${p(d.getDate())} - ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
    }

    function renderLGPickList() {
      const cur = getLGRound();
      let html = '';
      for (let i = 1; i <= 5; i++) {
        const r = cur - i;
        const { result } = getLGResult(r);
        const stats = lgStats(r, 30);
        const pct = result === '홀' ? stats.holPct : stats.jjakPct;
        html += `
          <div class="lg-pick-item">
            <div class="lg-pick-num">${i}</div>
            <div class="lg-pick-info">
              ${new Date().getMonth()+1}월 ${new Date().getDate()}일: ${r}회차<br>
              확률 ${pct}%
            </div>
            <span class="lg-pick-badge ${result === '홀' ? 'hol' : 'jjak'}">${result}</span>
          </div>`;
      }
      const el = document.getElementById('lgPickList');
      if (el) el.innerHTML = html;
    }

    function renderLGResultList() {
      const cur = getLGRound();
      const mo = new Date().getMonth()+1, dy = new Date().getDate();
      let html = `<div class="lg-result-item">
        <span class="lg-result-round">${mo}월 ${dy}일 - ${cur+1}</span>
        <span class="lg-result-badge wait">대기 중</span>
      </div>`;
      for (let i = 0; i < 14; i++) {
        const r = cur - i;
        const { result } = getLGResult(r);
        html += `<div class="lg-result-item">
          <span class="lg-result-round">${mo}월 ${dy}일 - ${r}</span>
          <span class="lg-result-badge ${result === '홀' ? 'hol' : 'jjak'}">${result}</span>
        </div>`;
      }
      const el = document.getElementById('lgResultList');
      if (el) el.innerHTML = html;
    }

    function updateLGStats() {
      const cur = getLGRound();
      const { holPct, jjakPct } = lgStats(cur, 50);
      const hEl = document.getElementById('lgPctHolL');
      const jEl = document.getElementById('lgPctJjakR');
      const bEl = document.getElementById('lgBarHol');
      if (hEl) hEl.textContent = holPct + '%';
      if (jEl) jEl.textContent = jjakPct + '%';
      if (bEl) bEl.style.width = holPct + '%';
    }

    function updateLGBetLock(locked) {
      const h = document.getElementById('lgBtnHol');
      const j = document.getElementById('lgBtnJjak');
      const s = document.getElementById('lgBetStatus');
      if (!h) return;
      h.disabled = locked || LG.isAnimating;
      j.disabled = locked || LG.isAnimating;
      if (s) s.textContent = locked ? '⛔ 배팅 마감' : (LG.betChoice ? `선택: ${LG.betChoice}` : '배팅을 선택하세요');
    }

    function initLadderGame() {
      if (LG.timer) clearInterval(LG.timer);
      const canvas = document.getElementById('lgCanvas');
      LG.ctx = canvas.getContext('2d');
      LG.round = getLGRound();

      renderLGPickList();
      renderLGResultList();
      updateLGStats();

      const initData = getLGResult(LG.round);
      lgDraw(initData.bars, initData.startLeft, null, null);

      LG.timer = setInterval(() => {
        const newRound = getLGRound();
        const secs = 60 - new Date().getSeconds();

        const dtEl = document.getElementById('lgDatetime');
        if (dtEl) dtEl.textContent = lgNow();

        const cdEl = document.getElementById('lgCountdown');
        if (cdEl) {
          const mm = String(Math.floor((secs-1)/60)).padStart(2,'0');
          const ss = String((secs-1)%60).padStart(2,'0');
          cdEl.textContent = `${mm}:${ss} 후 ${newRound}회차 추첨 시작`;
        }

        updateLGBetLock(secs <= 8);

        if (newRound !== LG.round && !LG.isAnimating) {
          const prevRound = LG.round;
          LG.round = newRound;

          lgAnimate(prevRound, () => {
            const { result } = getLGResult(prevRound);
            if (LG.betChoice) {
              const won = LG.betChoice === result;
              const bet = getBet();
              if (bet > 0 && bet <= points) {
                const payout = won ? Math.floor(bet * 1.95) : -bet;
                points += payout;
                gameHistory.unshift({ number: result, cls: result === '홀' ? 'odd' : 'even', choice: LG.betChoice, bet, payout: won ? payout : bet, isWin: won });
                updatePointsDisplay();
                savePoints();
                renderHistory();
              }
              LG.betChoice = null;
              document.getElementById('lgBtnHol').classList.remove('selected');
              document.getElementById('lgBtnJjak').classList.remove('selected');
            }

            setTimeout(() => {
              const d = getLGResult(LG.round);
              lgDraw(d.bars, d.startLeft, null, null);
              renderLGResultList();
              renderLGPickList();
              updateLGStats();
            }, 1800);
          });
        }
      }, 1000);
    }

    window.selectLGBet = function(choice) {
      if (document.getElementById('lgBtnHol').disabled) return;
      LG.betChoice = choice;
      document.getElementById('lgBtnHol').classList.toggle('selected', choice === '홀');
      document.getElementById('lgBtnJjak').classList.toggle('selected', choice === '짝');
      const s = document.getElementById('lgBetStatus');
      if (s) s.textContent = `선택: ${choice}`;
    };

    function renderHistory() {
      const list = document.getElementById('historyList');
      if (!gameHistory.length) { list.innerHTML = '<div class="history-empty">기록 없음</div>'; return; }
      list.innerHTML = gameHistory.slice(0, 20).map(h => `
        <div class="h-row ${h.isWin ? 'win' : 'lose'}">
          <span class="h-num ${h.cls}">${h.number}</span>
          <span class="h-info">${h.choice} / ${h.bet.toLocaleString()}P</span>
          <span class="h-result ${h.isWin ? 'win' : 'lose'}">${h.isWin ? '▲' : '▼'}${Math.abs(h.payout).toLocaleString()}</span>
        </div>
      `).join('');
    }
  </script>
</body>
