<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>홀짝 게임</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      min-height: 100vh;
      font-family: 'Segoe UI', sans-serif;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    h1 {
      font-size: 2.5rem;
      margin: 30px 0 10px;
      text-shadow: 0 0 20px #a78bfa;
      letter-spacing: 4px;
    }

    .subtitle {
      color: #a78bfa;
      margin-bottom: 40px;
      font-size: 0.95rem;
    }

    .card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(167, 139, 250, 0.3);
      border-radius: 20px;
      padding: 30px;
      width: 100%;
      max-width: 480px;
      margin-bottom: 20px;
      backdrop-filter: blur(10px);
    }

    /* 포인트 표시 */
    .points-display {
      text-align: center;
      margin-bottom: 10px;
    }

    .points-label {
      font-size: 0.85rem;
      color: #a78bfa;
      margin-bottom: 4px;
    }

    .points-value {
      font-size: 2.8rem;
      font-weight: bold;
      color: #fbbf24;
      text-shadow: 0 0 15px rgba(251, 191, 36, 0.5);
    }

    /* 배팅 금액 */
    .bet-section {
      margin-bottom: 20px;
    }

    .section-title {
      font-size: 0.85rem;
      color: #a78bfa;
      margin-bottom: 12px;
    }

    .bet-presets {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    .btn-preset {
      background: rgba(167, 139, 250, 0.15);
      border: 1px solid rgba(167, 139, 250, 0.4);
      color: #e2d9ff;
      padding: 10px 6px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s;
    }

    .btn-preset:hover {
      background: rgba(167, 139, 250, 0.35);
      transform: translateY(-2px);
    }

    .bet-input-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .bet-input {
      flex: 1;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(167, 139, 250, 0.4);
      border-radius: 10px;
      padding: 12px 16px;
      color: #fff;
      font-size: 1.1rem;
      text-align: right;
      outline: none;
    }

    .bet-input:focus {
      border-color: #a78bfa;
      box-shadow: 0 0 10px rgba(167, 139, 250, 0.3);
    }

    .btn-reset-bet {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
      padding: 12px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s;
    }

    .btn-reset-bet:hover {
      background: rgba(239, 68, 68, 0.35);
    }

    /* 홀/짝 선택 */
    .choice-section {
      margin-bottom: 20px;
    }

    .choice-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .btn-choice {
      padding: 22px;
      border-radius: 16px;
      border: 2px solid transparent;
      cursor: pointer;
      font-size: 1.5rem;
      font-weight: bold;
      letter-spacing: 2px;
      transition: all 0.2s;
    }

    .btn-choice:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-odd {
      background: linear-gradient(135deg, rgba(239, 68, 68, 0.2), rgba(239, 68, 68, 0.1));
      border-color: rgba(239, 68, 68, 0.5);
      color: #fca5a5;
    }

    .btn-odd:not(:disabled):hover {
      background: linear-gradient(135deg, rgba(239, 68, 68, 0.4), rgba(239, 68, 68, 0.2));
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(239, 68, 68, 0.3);
    }

    .btn-even {
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.2), rgba(59, 130, 246, 0.1));
      border-color: rgba(59, 130, 246, 0.5);
      color: #93c5fd;
    }

    .btn-even:not(:disabled):hover {
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.4), rgba(59, 130, 246, 0.2));
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(59, 130, 246, 0.3);
    }

    /* 결과 영역 */
    .result-area {
      text-align: center;
      min-height: 120px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .result-number {
      font-size: 5rem;
      font-weight: bold;
      line-height: 1;
      margin-bottom: 10px;
      transition: all 0.3s;
    }

    .result-number.odd {
      color: #fca5a5;
      text-shadow: 0 0 30px rgba(239, 68, 68, 0.6);
    }

    .result-number.even {
      color: #93c5fd;
      text-shadow: 0 0 30px rgba(59, 130, 246, 0.6);
    }

    .result-number.rolling {
      animation: roll 0.08s infinite alternate;
    }

    @keyframes roll {
      from { transform: scale(1.0); }
      to { transform: scale(1.08); }
    }

    .result-tag {
      font-size: 1.2rem;
      font-weight: bold;
      letter-spacing: 3px;
      margin-bottom: 8px;
    }

    .result-outcome {
      font-size: 1.6rem;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .result-outcome.win {
      color: #4ade80;
      text-shadow: 0 0 20px rgba(74, 222, 128, 0.6);
      animation: pop 0.3s ease-out;
    }

    .result-outcome.lose {
      color: #f87171;
      text-shadow: 0 0 20px rgba(248, 113, 113, 0.4);
    }

    @keyframes pop {
      0% { transform: scale(0.7); }
      60% { transform: scale(1.15); }
      100% { transform: scale(1.0); }
    }

    .result-change {
      font-size: 1rem;
      margin-top: 4px;
      color: #d1fae5;
    }

    .idle-text {
      color: rgba(255,255,255,0.25);
      font-size: 1rem;
    }

    /* 배당 안내 */
    .odds-info {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 10px;
      font-size: 0.8rem;
      color: rgba(255,255,255,0.4);
    }

    /* 히스토리 */
    .history-card {
      width: 100%;
      max-width: 480px;
    }

    .history-title {
      font-size: 0.9rem;
      color: #a78bfa;
      margin-bottom: 14px;
    }

    .history-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 220px;
      overflow-y: auto;
    }

    .history-list::-webkit-scrollbar {
      width: 4px;
    }

    .history-list::-webkit-scrollbar-thumb {
      background: rgba(167, 139, 250, 0.3);
      border-radius: 2px;
    }

    .history-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.88rem;
      background: rgba(255,255,255,0.04);
    }

    .history-item.win-item {
      border-left: 3px solid #4ade80;
    }

    .history-item.lose-item {
      border-left: 3px solid #f87171;
    }

    .h-num {
      font-size: 1.2rem;
      font-weight: bold;
      width: 36px;
      text-align: center;
    }

    .h-num.odd { color: #fca5a5; }
    .h-num.even { color: #93c5fd; }

    .h-info {
      flex: 1;
      color: rgba(255,255,255,0.7);
    }

    .h-result {
      font-weight: bold;
    }

    .h-result.win { color: #4ade80; }
    .h-result.lose { color: #f87171; }

    .history-empty {
      text-align: center;
      color: rgba(255,255,255,0.25);
      font-size: 0.85rem;
      padding: 20px 0;
    }

    /* 충전 버튼 */
    .btn-recharge {
      background: linear-gradient(135deg, rgba(251, 191, 36, 0.2), rgba(251, 191, 36, 0.1));
      border: 1px solid rgba(251, 191, 36, 0.4);
      color: #fbbf24;
      padding: 10px 22px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.85rem;
      margin-top: 10px;
      transition: all 0.2s;
    }

    .btn-recharge:hover {
      background: rgba(251, 191, 36, 0.3);
    }
  </style>
</head>
<body>

  <h1>🎲 홀짝 게임</h1>
  <p class="subtitle">숫자를 보고 홀수인지 짝수인지 맞춰보세요!</p>

  <div class="card">
    <!-- 포인트 -->
    <div class="points-display">
      <div class="points-label">보유 포인트</div>
      <div class="points-value" id="pointsDisplay">10,000 P</div>
      <button class="btn-recharge" onclick="recharge()">+ 포인트 충전 (10,000P)</button>
    </div>
  </div>

  <div class="card">
    <!-- 배팅 금액 -->
    <div class="bet-section">
      <div class="section-title">배팅 금액을 선택하세요</div>
      <div class="bet-presets">
        <button class="btn-preset" onclick="addBet(100)">+100</button>
        <button class="btn-preset" onclick="addBet(500)">+500</button>
        <button class="btn-preset" onclick="addBet(1000)">+1,000</button>
        <button class="btn-preset" onclick="setBetAll()">전부</button>
      </div>
      <div class="bet-input-row">
        <input class="bet-input" type="number" id="betInput" placeholder="0" min="1" value="">
        <button class="btn-reset-bet" onclick="resetBet()">초기화</button>
      </div>
    </div>

    <!-- 홀/짝 선택 버튼 -->
    <div class="choice-section">
      <div class="section-title">홀수? 짝수? 골라보세요  •  배당 2배</div>
      <div class="choice-buttons">
        <button class="btn-choice btn-odd" id="btnOdd" onclick="play('홀')">홀 (ODD)</button>
        <button class="btn-choice btn-even" id="btnEven" onclick="play('짝')">짝 (EVEN)</button>
      </div>
    </div>

    <!-- 결과 -->
    <div class="result-area" id="resultArea">
      <div class="idle-text">버튼을 눌러 게임을 시작하세요</div>
    </div>

    <div class="odds-info">
      <span>맞추면 배팅액 × 2배 지급</span>
      <span>틀리면 배팅액 차감</span>
    </div>
  </div>

  <!-- 히스토리 -->
  <div class="card history-card">
    <div class="history-title">게임 기록</div>
    <ul class="history-list" id="historyList">
      <li class="history-empty">아직 게임 기록이 없습니다.</li>
    </ul>
  </div>

  <script>
    let points = 10000;
    const history = [];

    function updatePointsDisplay() {
      document.getElementById('pointsDisplay').textContent = points.toLocaleString() + ' P';
    }

    function getBet() {
      const val = parseInt(document.getElementById('betInput').value, 10);
      return isNaN(val) || val <= 0 ? 0 : val;
    }

    function addBet(amount) {
      const current = getBet();
      document.getElementById('betInput').value = current + amount;
    }

    function setBetAll() {
      document.getElementById('betInput').value = points;
    }

    function resetBet() {
      document.getElementById('betInput').value = '';
    }

    function recharge() {
      points += 10000;
      updatePointsDisplay();
      showMessage('10,000 포인트가 충전되었습니다!', '#fbbf24');
    }

    function showMessage(msg, color) {
      const el = document.getElementById('resultArea');
      el.innerHTML = `<div style="color:${color};font-size:1rem;">${msg}</div>`;
    }

    function setButtons(disabled) {
      document.getElementById('btnOdd').disabled = disabled;
      document.getElementById('btnEven').disabled = disabled;
    }

    function play(choice) {
      const bet = getBet();

      if (bet <= 0) {
        showMessage('배팅 금액을 입력해주세요!', '#fbbf24');
        return;
      }
      if (bet > points) {
        showMessage('포인트가 부족합니다!', '#f87171');
        return;
      }

      setButtons(true);

      // 숫자 롤링 애니메이션
      const resultArea = document.getElementById('resultArea');
      let rollCount = 0;
      const maxRolls = 18;

      resultArea.innerHTML = `<div class="result-number rolling" id="rollingNum">?</div>`;
      const rollingEl = document.getElementById('rollingNum');

      const rollInterval = setInterval(() => {
        const randNum = Math.floor(Math.random() * 100) + 1;
        rollingEl.textContent = randNum;
        rollingEl.className = 'result-number rolling ' + (randNum % 2 === 1 ? 'odd' : 'even');
        rollCount++;

        if (rollCount >= maxRolls) {
          clearInterval(rollInterval);
          const finalNum = Math.floor(Math.random() * 100) + 1;
          showResult(choice, bet, finalNum);
        }
      }, 80);
    }

    function showResult(choice, bet, number) {
      const isOdd = number % 2 === 1;
      const resultTag = isOdd ? '홀' : '짝';
      const numClass = isOdd ? 'odd' : 'even';

      const isWin = (choice === '홀' && isOdd) || (choice === '짝' && !isOdd);
      const payout = isWin ? bet : -bet;
      points += payout;
      updatePointsDisplay();

      const outcomeText = isWin ? '🎉 WIN! 맞췄습니다!' : '😢 LOSE! 틀렸습니다';
      const outcomeClass = isWin ? 'win' : 'lose';
      const changeText = isWin ? `+${bet.toLocaleString()} P 획득!` : `-${bet.toLocaleString()} P 차감`;

      document.getElementById('resultArea').innerHTML = `
        <div class="result-number ${numClass}">${number}</div>
        <div class="result-tag ${numClass}">${resultTag}수</div>
        <div class="result-outcome ${outcomeClass}">${outcomeText}</div>
        <div class="result-change">${changeText}</div>
      `;

      // 히스토리 추가
      addHistory(number, numClass, choice, bet, isWin, payout);
      setButtons(false);
    }

    function addHistory(number, numClass, choice, bet, isWin, payout) {
      const item = {
        number, numClass, choice, bet, isWin, payout
      };
      history.unshift(item);
      renderHistory();
    }

    function renderHistory() {
      const list = document.getElementById('historyList');

      if (history.length === 0) {
        list.innerHTML = '<li class="history-empty">아직 게임 기록이 없습니다.</li>';
        return;
      }

      list.innerHTML = history.slice(0, 20).map((h, i) => `
        <li class="history-item ${h.isWin ? 'win-item' : 'lose-item'}">
          <span class="h-num ${h.numClass}">${h.number}</span>
          <span class="h-info">${h.choice} 선택 / 배팅 ${h.bet.toLocaleString()}P</span>
          <span class="h-result ${h.isWin ? 'win' : 'lose'}">
            ${h.isWin ? '▲' : '▼'} ${Math.abs(h.payout).toLocaleString()}P
          </span>
        </li>
      `).join('');
    }

    updatePointsDisplay();
    renderHistory();
  </script>
</body>
</html>
