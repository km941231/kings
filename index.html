<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>홀짝 게임</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      min-height: 100vh;
      font-family: 'Segoe UI', sans-serif;
      color: #fff;
    }

    /* ───── 로그인 화면 ───── */
    #loginScreen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .login-logo {
      font-size: 2.4rem;
      font-weight: bold;
      letter-spacing: 4px;
      text-shadow: 0 0 20px #a78bfa;
      margin-bottom: 8px;
    }

    .login-sub {
      color: #a78bfa;
      font-size: 0.9rem;
      margin-bottom: 36px;
    }

    .login-card {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(167,139,250,0.3);
      border-radius: 20px;
      padding: 32px 28px;
      width: 100%;
      max-width: 400px;
      backdrop-filter: blur(10px);
    }

    /* 탭 (로그인 / 회원가입) */
    .tab-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 28px;
    }

    .tab-btn {
      padding: 10px;
      border-radius: 10px;
      border: 1px solid rgba(167,139,250,0.3);
      background: transparent;
      color: rgba(255,255,255,0.45);
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: rgba(167,139,250,0.25);
      border-color: #a78bfa;
      color: #fff;
      font-weight: bold;
    }

    /* 입력 필드 */
    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      font-size: 0.78rem;
      color: #a78bfa;
      margin-bottom: 5px;
    }

    .field input {
      width: 100%;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(167,139,250,0.35);
      border-radius: 10px;
      padding: 12px 14px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .field input:focus {
      border-color: #a78bfa;
      box-shadow: 0 0 8px rgba(167,139,250,0.3);
    }

    .field input::placeholder { color: rgba(255,255,255,0.25); }

    .error-msg {
      font-size: 0.82rem;
      color: #f87171;
      margin-bottom: 12px;
      min-height: 18px;
      text-align: center;
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #7c3aed, #a78bfa);
      color: #fff;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      letter-spacing: 1px;
      transition: opacity 0.2s, transform 0.1s;
    }

    .btn-submit:hover { opacity: 0.88; transform: translateY(-1px); }
    .btn-submit:active { transform: translateY(0); }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ───── 게임 화면 ───── */
    #gameScreen {
      display: none;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    /* 상단 유저 바 */
    .user-bar {
      width: 100%;
      max-width: 480px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 18px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(167,139,250,0.2);
      border-radius: 14px;
      margin-bottom: 20px;
    }

    .user-greeting {
      font-size: 0.9rem;
      color: rgba(255,255,255,0.7);
    }

    .user-greeting span {
      color: #a78bfa;
      font-weight: bold;
    }

    .btn-logout {
      background: rgba(239,68,68,0.15);
      border: 1px solid rgba(239,68,68,0.35);
      color: #fca5a5;
      padding: 7px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.8rem;
      transition: background 0.2s;
    }

    .btn-logout:hover { background: rgba(239,68,68,0.3); }

    h1 {
      font-size: 2.5rem;
      margin: 10px 0 8px;
      text-shadow: 0 0 20px #a78bfa;
      letter-spacing: 4px;
    }

    .subtitle {
      color: #a78bfa;
      margin-bottom: 30px;
      font-size: 0.95rem;
    }

    .card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(167,139,250,0.3);
      border-radius: 20px;
      padding: 30px;
      width: 100%;
      max-width: 480px;
      margin-bottom: 20px;
      backdrop-filter: blur(10px);
    }

    .points-display { text-align: center; margin-bottom: 10px; }
    .points-label { font-size: 0.85rem; color: #a78bfa; margin-bottom: 4px; }
    .points-value {
      font-size: 2.8rem;
      font-weight: bold;
      color: #fbbf24;
      text-shadow: 0 0 15px rgba(251,191,36,0.5);
    }

    .btn-recharge {
      background: linear-gradient(135deg, rgba(251,191,36,0.2), rgba(251,191,36,0.1));
      border: 1px solid rgba(251,191,36,0.4);
      color: #fbbf24;
      padding: 10px 22px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.85rem;
      margin-top: 10px;
      transition: all 0.2s;
    }

    .btn-recharge:hover { background: rgba(251,191,36,0.3); }

    .bet-section { margin-bottom: 20px; }
    .section-title { font-size: 0.85rem; color: #a78bfa; margin-bottom: 12px; }

    .bet-presets {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    .btn-preset {
      background: rgba(167,139,250,0.15);
      border: 1px solid rgba(167,139,250,0.4);
      color: #e2d9ff;
      padding: 10px 6px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s;
    }

    .btn-preset:hover { background: rgba(167,139,250,0.35); transform: translateY(-2px); }

    .bet-input-row { display: flex; gap: 10px; align-items: center; }

    .bet-input {
      flex: 1;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(167,139,250,0.4);
      border-radius: 10px;
      padding: 12px 16px;
      color: #fff;
      font-size: 1.1rem;
      text-align: right;
      outline: none;
    }

    .bet-input:focus { border-color: #a78bfa; box-shadow: 0 0 10px rgba(167,139,250,0.3); }

    .btn-reset-bet {
      background: rgba(239,68,68,0.2);
      border: 1px solid rgba(239,68,68,0.4);
      color: #fca5a5;
      padding: 12px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s;
    }

    .btn-reset-bet:hover { background: rgba(239,68,68,0.35); }

    .choice-section { margin-bottom: 20px; }

    .choice-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

    .btn-choice {
      padding: 22px;
      border-radius: 16px;
      border: 2px solid transparent;
      cursor: pointer;
      font-size: 1.5rem;
      font-weight: bold;
      letter-spacing: 2px;
      transition: all 0.2s;
    }

    .btn-choice:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-odd {
      background: linear-gradient(135deg, rgba(239,68,68,0.2), rgba(239,68,68,0.1));
      border-color: rgba(239,68,68,0.5);
      color: #fca5a5;
    }

    .btn-odd:not(:disabled):hover {
      background: linear-gradient(135deg, rgba(239,68,68,0.4), rgba(239,68,68,0.2));
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(239,68,68,0.3);
    }

    .btn-even {
      background: linear-gradient(135deg, rgba(59,130,246,0.2), rgba(59,130,246,0.1));
      border-color: rgba(59,130,246,0.5);
      color: #93c5fd;
    }

    .btn-even:not(:disabled):hover {
      background: linear-gradient(135deg, rgba(59,130,246,0.4), rgba(59,130,246,0.2));
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(59,130,246,0.3);
    }

    .result-area {
      text-align: center;
      min-height: 120px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .result-number {
      font-size: 5rem;
      font-weight: bold;
      line-height: 1;
      margin-bottom: 10px;
      transition: all 0.3s;
    }

    .result-number.odd { color: #fca5a5; text-shadow: 0 0 30px rgba(239,68,68,0.6); }
    .result-number.even { color: #93c5fd; text-shadow: 0 0 30px rgba(59,130,246,0.6); }
    .result-number.rolling { animation: roll 0.08s infinite alternate; }

    @keyframes roll { from { transform: scale(1.0); } to { transform: scale(1.08); } }

    .result-tag { font-size: 1.2rem; font-weight: bold; letter-spacing: 3px; margin-bottom: 8px; }

    .result-outcome { font-size: 1.6rem; font-weight: bold; letter-spacing: 2px; }

    .result-outcome.win {
      color: #4ade80;
      text-shadow: 0 0 20px rgba(74,222,128,0.6);
      animation: pop 0.3s ease-out;
    }

    .result-outcome.lose { color: #f87171; }

    @keyframes pop {
      0% { transform: scale(0.7); }
      60% { transform: scale(1.15); }
      100% { transform: scale(1.0); }
    }

    .result-change { font-size: 1rem; margin-top: 4px; color: #d1fae5; }
    .idle-text { color: rgba(255,255,255,0.25); font-size: 1rem; }

    .odds-info {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 10px;
      font-size: 0.8rem;
      color: rgba(255,255,255,0.4);
    }

    .history-card { width: 100%; max-width: 480px; }
    .history-title { font-size: 0.9rem; color: #a78bfa; margin-bottom: 14px; }

    .history-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 220px;
      overflow-y: auto;
    }

    .history-list::-webkit-scrollbar { width: 4px; }
    .history-list::-webkit-scrollbar-thumb { background: rgba(167,139,250,0.3); border-radius: 2px; }

    .history-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.88rem;
      background: rgba(255,255,255,0.04);
    }

    .history-item.win-item { border-left: 3px solid #4ade80; }
    .history-item.lose-item { border-left: 3px solid #f87171; }

    .h-num { font-size: 1.2rem; font-weight: bold; width: 36px; text-align: center; }
    .h-num.odd { color: #fca5a5; }
    .h-num.even { color: #93c5fd; }

    .h-info { flex: 1; color: rgba(255,255,255,0.7); }
    .h-result { font-weight: bold; }
    .h-result.win { color: #4ade80; }
    .h-result.lose { color: #f87171; }

    .history-empty {
      text-align: center;
      color: rgba(255,255,255,0.25);
      font-size: 0.85rem;
      padding: 20px 0;
    }

    .saving-indicator {
      font-size: 0.75rem;
      color: rgba(167,139,250,0.6);
      text-align: center;
      margin-top: -10px;
      margin-bottom: 10px;
      min-height: 16px;
    }
  </style>
</head>
<body>

  <!-- ───── 로그인 화면 ───── -->
  <div id="loginScreen">
    <div class="login-logo">🎲 홀짝 게임</div>
    <p class="login-sub">로그인하고 게임을 시작하세요</p>

    <div class="login-card">
      <div class="tab-row">
        <button class="tab-btn active" id="tabLogin" onclick="switchTab('login')">로그인</button>
        <button class="tab-btn" id="tabRegister" onclick="switchTab('register')">회원가입</button>
      </div>

      <!-- 회원가입 전용 필드 -->
      <div class="field" id="fieldNickname" style="display:none">
        <label>닉네임</label>
        <input type="text" id="nicknameInput" placeholder="게임에서 사용할 닉네임" maxlength="12">
      </div>

      <div class="field">
        <label>이메일</label>
        <input type="email" id="emailInput" placeholder="example@email.com">
      </div>

      <div class="field">
        <label>비밀번호</label>
        <input type="password" id="passwordInput" placeholder="6자 이상" onkeydown="handleEnter(event)">
      </div>

      <!-- 회원가입 전용 필드 -->
      <div class="field" id="fieldPasswordConfirm" style="display:none">
        <label>비밀번호 확인</label>
        <input type="password" id="passwordConfirmInput" placeholder="비밀번호를 다시 입력" onkeydown="handleEnter(event)">
      </div>

      <p class="error-msg" id="authError"></p>

      <button class="btn-submit" id="submitBtn" onclick="handleSubmit()">로그인</button>
    </div>
  </div>

  <!-- ───── 게임 화면 ───── -->
  <div id="gameScreen">
    <div class="user-bar">
      <div class="user-greeting">안녕하세요, <span id="userNickname"></span>님!</div>
      <button class="btn-logout" onclick="handleLogout()">로그아웃</button>
    </div>

    <h1>🎲 홀짝 게임</h1>
    <p class="subtitle">숫자를 보고 홀수인지 짝수인지 맞춰보세요!</p>

    <div class="card">
      <div class="points-display">
        <div class="points-label">보유 포인트</div>
        <div class="points-value" id="pointsDisplay">0 P</div>
        <button class="btn-recharge" onclick="recharge()">+ 포인트 충전 (10,000P)</button>
      </div>
    </div>

    <div class="saving-indicator" id="savingIndicator"></div>

    <div class="card">
      <div class="bet-section">
        <div class="section-title">배팅 금액을 선택하세요</div>
        <div class="bet-presets">
          <button class="btn-preset" onclick="addBet(100)">+100</button>
          <button class="btn-preset" onclick="addBet(500)">+500</button>
          <button class="btn-preset" onclick="addBet(1000)">+1,000</button>
          <button class="btn-preset" onclick="setBetAll()">전부</button>
        </div>
        <div class="bet-input-row">
          <input class="bet-input" type="number" id="betInput" placeholder="0" min="1">
          <button class="btn-reset-bet" onclick="resetBet()">초기화</button>
        </div>
      </div>

      <div class="choice-section">
        <div class="section-title">홀수? 짝수? 골라보세요  •  배당 2배</div>
        <div class="choice-buttons">
          <button class="btn-choice btn-odd" id="btnOdd" onclick="play('홀')">홀 (ODD)</button>
          <button class="btn-choice btn-even" id="btnEven" onclick="play('짝')">짝 (EVEN)</button>
        </div>
      </div>

      <div class="result-area" id="resultArea">
        <div class="idle-text">버튼을 눌러 게임을 시작하세요</div>
      </div>

      <div class="odds-info">
        <span>맞추면 배팅액 × 2배 지급</span>
        <span>틀리면 배팅액 차감</span>
      </div>
    </div>

    <div class="card history-card">
      <div class="history-title">게임 기록</div>
      <ul class="history-list" id="historyList">
        <li class="history-empty">아직 게임 기록이 없습니다.</li>
      </ul>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import {
      getAuth,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      signOut,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import {
      getFirestore,
      doc,
      getDoc,
      setDoc,
      updateDoc
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    // ── Firebase 초기화 ──
    const firebaseConfig = {
      apiKey: "AIzaSyDJv5VYIt2xFrQmignCwSzuThAkULz1NW8",
      authDomain: "kings-44a9b.firebaseapp.com",
      projectId: "kings-44a9b",
      storageBucket: "kings-44a9b.firebasestorage.app",
      messagingSenderId: "715133382138",
      appId: "1:715133382138:web:62cf478cc321fa418c0843"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // ── 게임 상태 ──
    let points = 0;
    let gameHistory = [];
    let currentUid = null;

    // ── 로그인 상태 감지 ──
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUid = user.uid;
        await loadUserData(user.uid);
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('gameScreen').style.display = 'flex';
      } else {
        currentUid = null;
        document.getElementById('loginScreen').style.display = 'flex';
        document.getElementById('gameScreen').style.display = 'none';
      }
    });

    // ── Firestore에서 유저 데이터 불러오기 ──
    async function loadUserData(uid) {
      const snap = await getDoc(doc(db, 'users', uid));
      if (snap.exists()) {
        const data = snap.data();
        points = data.points ?? 10000;
        document.getElementById('userNickname').textContent = data.nickname;
        updatePointsDisplay();
      }
    }

    // ── Firestore에 포인트 저장 ──
    async function savePoints() {
      if (!currentUid) return;
      const indicator = document.getElementById('savingIndicator');
      indicator.textContent = '저장 중...';
      await updateDoc(doc(db, 'users', currentUid), { points });
      indicator.textContent = '✓ 저장됨';
      setTimeout(() => { indicator.textContent = ''; }, 1500);
    }

    // ── 탭 전환 ──
    window.switchTab = function(tab) {
      const isRegister = tab === 'register';
      document.getElementById('tabLogin').classList.toggle('active', !isRegister);
      document.getElementById('tabRegister').classList.toggle('active', isRegister);
      document.getElementById('fieldNickname').style.display = isRegister ? 'block' : 'none';
      document.getElementById('fieldPasswordConfirm').style.display = isRegister ? 'block' : 'none';
      document.getElementById('submitBtn').textContent = isRegister ? '회원가입' : '로그인';
      document.getElementById('authError').textContent = '';
    };

    // ── Enter 키로 제출 ──
    window.handleEnter = function(e) {
      if (e.key === 'Enter') handleSubmit();
    };

    // ── 로그인 / 회원가입 처리 ──
    window.handleSubmit = async function() {
      const isRegister = document.getElementById('tabRegister').classList.contains('active');
      const email = document.getElementById('emailInput').value.trim();
      const password = document.getElementById('passwordInput').value;
      const btn = document.getElementById('submitBtn');
      const errorEl = document.getElementById('authError');

      errorEl.textContent = '';

      if (!email || !password) {
        errorEl.textContent = '이메일과 비밀번호를 입력해주세요.';
        return;
      }

      btn.disabled = true;
      btn.textContent = '처리 중...';

      try {
        if (isRegister) {
          const nickname = document.getElementById('nicknameInput').value.trim();
          const confirm = document.getElementById('passwordConfirmInput').value;
          if (!nickname) { errorEl.textContent = '닉네임을 입력해주세요.'; return; }
          if (password !== confirm) { errorEl.textContent = '비밀번호가 일치하지 않습니다.'; return; }

          const cred = await createUserWithEmailAndPassword(auth, email, password);
          await setDoc(doc(db, 'users', cred.user.uid), {
            email,
            nickname,
            points: 10000,
            createdAt: new Date()
          });
        } else {
          await signInWithEmailAndPassword(auth, email, password);
        }
      } catch (e) {
        errorEl.textContent = parseAuthError(e.code);
      } finally {
        btn.disabled = false;
        btn.textContent = isRegister ? '회원가입' : '로그인';
      }
    };

    function parseAuthError(code) {
      const map = {
        'auth/invalid-credential': '이메일 또는 비밀번호가 틀렸습니다.',
        'auth/user-not-found': '존재하지 않는 계정입니다.',
        'auth/wrong-password': '비밀번호가 틀렸습니다.',
        'auth/email-already-in-use': '이미 사용 중인 이메일입니다.',
        'auth/weak-password': '비밀번호는 6자 이상이어야 합니다.',
        'auth/invalid-email': '올바른 이메일 형식이 아닙니다.',
        'auth/too-many-requests': '잠시 후 다시 시도해주세요.'
      };
      return map[code] ?? '오류가 발생했습니다. 다시 시도해주세요.';
    }

    // ── 로그아웃 ──
    window.handleLogout = async function() {
      await signOut(auth);
      gameHistory = [];
      renderHistory();
      document.getElementById('resultArea').innerHTML = '<div class="idle-text">버튼을 눌러 게임을 시작하세요</div>';
    };

    // ── 포인트 표시 업데이트 ──
    function updatePointsDisplay() {
      document.getElementById('pointsDisplay').textContent = points.toLocaleString() + ' P';
    }

    // ── 배팅 관련 ──
    function getBet() {
      const val = parseInt(document.getElementById('betInput').value, 10);
      return isNaN(val) || val <= 0 ? 0 : val;
    }

    window.addBet = function(amount) {
      document.getElementById('betInput').value = getBet() + amount;
    };

    window.setBetAll = function() {
      document.getElementById('betInput').value = points;
    };

    window.resetBet = function() {
      document.getElementById('betInput').value = '';
    };

    window.recharge = async function() {
      points += 10000;
      updatePointsDisplay();
      showMessage('10,000 포인트가 충전되었습니다!', '#fbbf24');
      await savePoints();
    };

    function showMessage(msg, color) {
      document.getElementById('resultArea').innerHTML =
        `<div style="color:${color};font-size:1rem;">${msg}</div>`;
    }

    function setButtons(disabled) {
      document.getElementById('btnOdd').disabled = disabled;
      document.getElementById('btnEven').disabled = disabled;
    }

    // ── 게임 플레이 ──
    window.play = function(choice) {
      const bet = getBet();
      if (bet <= 0) { showMessage('배팅 금액을 입력해주세요!', '#fbbf24'); return; }
      if (bet > points) { showMessage('포인트가 부족합니다!', '#f87171'); return; }

      setButtons(true);

      const resultArea = document.getElementById('resultArea');
      let rollCount = 0;
      resultArea.innerHTML = `<div class="result-number rolling" id="rollingNum">?</div>`;
      const rollingEl = document.getElementById('rollingNum');

      const rollInterval = setInterval(async () => {
        const r = Math.floor(Math.random() * 100) + 1;
        rollingEl.textContent = r;
        rollingEl.className = 'result-number rolling ' + (r % 2 === 1 ? 'odd' : 'even');
        rollCount++;

        if (rollCount >= 18) {
          clearInterval(rollInterval);
          const final = Math.floor(Math.random() * 100) + 1;
          await showResult(choice, bet, final);
        }
      }, 80);
    };

    async function showResult(choice, bet, number) {
      const isOdd = number % 2 === 1;
      const numClass = isOdd ? 'odd' : 'even';
      const resultTag = isOdd ? '홀' : '짝';
      const isWin = (choice === '홀' && isOdd) || (choice === '짝' && !isOdd);
      const payout = isWin ? bet : -bet;

      points += payout;
      updatePointsDisplay();

      document.getElementById('resultArea').innerHTML = `
        <div class="result-number ${numClass}">${number}</div>
        <div class="result-tag ${numClass}">${resultTag}수</div>
        <div class="result-outcome ${isWin ? 'win' : 'lose'}">${isWin ? '🎉 WIN! 맞췄습니다!' : '😢 LOSE! 틀렸습니다'}</div>
        <div class="result-change">${isWin ? '+' : ''}${payout.toLocaleString()} P</div>
      `;

      gameHistory.unshift({ number, numClass, choice, bet, isWin, payout });
      renderHistory();
      setButtons(false);

      await savePoints();
    }

    function renderHistory() {
      const list = document.getElementById('historyList');
      if (gameHistory.length === 0) {
        list.innerHTML = '<li class="history-empty">아직 게임 기록이 없습니다.</li>';
        return;
      }
      list.innerHTML = gameHistory.slice(0, 20).map(h => `
        <li class="history-item ${h.isWin ? 'win-item' : 'lose-item'}">
          <span class="h-num ${h.numClass}">${h.number}</span>
          <span class="h-info">${h.choice} 선택 / 배팅 ${h.bet.toLocaleString()}P</span>
          <span class="h-result ${h.isWin ? 'win' : 'lose'}">
            ${h.isWin ? '▲' : '▼'} ${Math.abs(h.payout).toLocaleString()}P
          </span>
        </li>
      `).join('');
    }
  </script>
</body>
</html>
